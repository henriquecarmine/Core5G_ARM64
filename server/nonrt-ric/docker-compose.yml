# nonRT RIC — par mínimo A1, imagens ARM64 próprias (build_arm64.sh).
#
# Espelha o layout da Fase 1 do lab do Prof. Kunzler
# (external/cesar-school-repo/data/code/oai-cn-gnb-nonrt-nearrt/config/nonrtric/):
# mesmos nomes de serviço/containers/rede e os 3 sabores de A1 Simulator, para
# os roteiros e testdata dele funcionarem aqui sem adaptação. Sem gateway e
# control panel por ora (Angular/nginx — candidatos da próxima iteração).
services:
  policy-agent:
    image: "core5g/nonrt-a1pms:${PMS_TAG:-2.9.0}-arm64"
    container_name: nonrt-policy-agent
    hostname: policy-agent
    networks:
      oran-nonrt:
        aliases:
          - policy-agent-container
    ports:
      - "${NONRT_PMS_HTTP_PORT:-8081}:8081"
    volumes:
      - ./application_configuration.json:/opt/app/policy-agent/data/application_configuration.json:ro
    healthcheck:
      # A imagem não tem curl/wget; /dev/tcp via bash (padrão do lab do docente).
      test:
        - CMD-SHELL
        - >
          bash -c 'exec 3<>/dev/tcp/localhost/8081 &&
          printf "GET /a1-policy/v2/status HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          head -c 512 <&3 | grep -qE "success|hunky dory"'
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  a1-sim-OSC:
    image: "core5g/nonrt-a1sim:${SIM_TAG:-2.8.0}-arm64"
    container_name: a1-sim-OSC
    networks:
      - oran-nonrt
    ports:
      - "30001:8085"
      - "30002:8185"
    environment:
      A1_VERSION: OSC_2.1.0
      REMOTE_HOSTS_LOGGING: "1"
      ALLOW_HTTP: "true"

  a1-sim-STD:
    image: "core5g/nonrt-a1sim:${SIM_TAG:-2.8.0}-arm64"
    container_name: a1-sim-STD
    networks:
      - oran-nonrt
    ports:
      - "30003:8085"
      - "30004:8185"
    environment:
      A1_VERSION: STD_1.1.3
      REMOTE_HOSTS_LOGGING: "1"
      ALLOW_HTTP: "true"

  a1-sim-STD-v2:
    image: "core5g/nonrt-a1sim:${SIM_TAG:-2.8.0}-arm64"
    container_name: a1-sim-STD-v2
    networks:
      - oran-nonrt
    ports:
      - "30005:8085"
      - "30006:8185"
    environment:
      A1_VERSION: STD_2.0.0
      REMOTE_HOSTS_LOGGING: "1"
      ALLOW_HTTP: "true"

networks:
  oran-nonrt:
    name: oran-nonrt-net
    driver: bridge
