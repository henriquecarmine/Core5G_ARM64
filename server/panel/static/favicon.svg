<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Core5G_ARM64">
  <!-- A assinatura da identidade em 16px: a grade de recursos de um quadro 5G
       (tempo x frequência), com as células ocupadas acesas. Fundo no acento do
       sistema; células vazias em traço, ocupadas cheias. Ver docs/identidade-visual.md -->
  <rect width="32" height="32" rx="7" fill="#7974e8"/>
  <g fill="#fcfcff">
    <rect x="6"  y="6"  width="6" height="6" rx="1.4" opacity=".38"/>
    <rect x="13" y="6"  width="6" height="6" rx="1.4"/>
    <rect x="20" y="6"  width="6" height="6" rx="1.4" opacity=".38"/>
    <rect x="6"  y="13" width="6" height="6" rx="1.4"/>
    <rect x="13" y="13" width="6" height="6" rx="1.4" opacity=".38"/>
    <rect x="20" y="13" width="6" height="6" rx="1.4"/>
    <rect x="6"  y="20" width="6" height="6" rx="1.4" opacity=".38"/>
    <rect x="13" y="20" width="6" height="6" rx="1.4"/>
    <rect x="20" y="20" width="6" height="6" rx="1.4" opacity=".38"/>
  </g>
</svg>
