<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula · Core5G_ARM64</title>
<link rel="stylesheet" href="/static/tokens.css?v=%VER%">
<link rel="stylesheet" href="/static/lab/lab-ponte.css?v=%VER%">
<link rel="stylesheet" href="/static/lab/lab-estudos.css?v=%VER%">
</head>
<body>
<div class="wrap">
  <div class="ident">
    <a id="back-estudo" href="/lab" class="back">←</a>
    <div class="trilha" id="eyebrow" data-i18n="aula.word">Aula</div>
    <div class="dir"><div id="langsel" class="langsel"></div><button class="themebtn" id="themeBtn" title="Tema" aria-label="Alternar tema">◐</button></div>
  </div>
  <div class="tit"><h1 id="h1">…</h1><span id="tag-previa"></span></div>
  <details class="resumo" id="resumo"><summary data-i18n="aula.sobre">sobre esta aula</summary>
    <p class="lead" id="lead"></p></details>

  <div class="card"><h2 data-i18n="aula.obj">🎯 O que você vai aprender</h2><ul class="obj" id="obj"></ul></div>

  <h2 class="section-h" data-i18n="aula.conc">Conceitos, na ordem dos slides</h2>
  <div class="conceitos" id="conceitos"></div>

  <div id="formulas"></div>

  <div class="card"><h2 data-i18n="aula.onde_h">🛰️ Onde isso roda no nosso lab</h2><p id="onde-txt"></p><div class="mm" id="mm"></div></div>

  <div class="card"><h2 data-i18n="aula.ex_h">🎛️ Exercícios</h2><p class="sub" id="ex-sub"></p><div class="exlist" id="ex"></div></div>

  <div class="card"><h2 data-i18n="aula.quiz_h">❓ Quiz de fixação</h2><div class="quiz" id="quiz"></div></div>

  <div class="nav" id="nav"></div>
  <footer id="footer"></footer>
</div>

<script src="/static/ops/mini-map.js?v=%VER%"></script>
<script src="/static/lab/lab-i18n.js?v=%VER%"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const T=(k,p)=>window.LABI18N?LABI18N.t(k,p):k;
const LANG=(window.LABI18N&&LABI18N.lang)||"pt";
async function jl(name){if(LANG!=="pt"){try{const r=await fetch(`/static/lab/estudos/${name}.${LANG}.json`,{cache:"no-store"});if(r.ok)return r.json();}catch(x){}}return (await fetch(`/static/lab/estudos/${name}.json`,{cache:"no-store"})).json();}
if(window.LABI18N)LABI18N.onChange(()=>location.reload());
const DO_PAINEL = (() => {   // fui aberta PELO painel? é ele quem executa
  try { return !!(window.opener && !window.opener.closed); } catch (e) { return false; }
})();
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const GH="https://github.com/henriquecarmine/Core5G_ARM64/blob/main/";
const M=location.pathname.match(/\/lab\/estudo\/(\d)\/aula\/(\d+)/)||[];
const N=parseInt(M[1]||"4",10), K=parseInt(M[2]||"1",10);

$("#themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",c==="dark"?"light":"dark");});

function runBtn(cmd,label){
  if(DO_PAINEL) return `<button class="runb" data-cmd="${esc(cmd)}" title="${esc(cmd)}">▶ ${esc(label)}</button>`;
  return `<a class="runb ghost" href="/" title="${esc(T("est.run_hint"))}">▶ ${esc(label)} <small>${esc(T("est.in_panel"))}</small></a>`;
}

async function main(){
  const idx=await jl("index");
  const e=idx.estudos.find(x=>x.n===N);
  const id=e.aulas[K-1];
  const a=await jl(id);
  const W=T("est.word"), A=T("aula.word");
  document.title=`${A} ${a.n} · ${a.titulo}`;
  // O link de voltar diz para ONDE volta, curto. O título inteiro da cadeira ia
  // aqui e reaparecia na trilha ao lado — a mesma frase duas vezes na mesma
  // linha. Agora ele mora no tooltip.
  $("#back-estudo").textContent=`← ${W} ${e.n}`; $("#back-estudo").href=`/lab/estudo/${e.n}`;
  $("#back-estudo").title=`${W} ${e.n} · ${e.titulo}`;
  // sem repetir a cadeira: o link de voltar, ao lado, já diz isso.
  $("#eyebrow").textContent=`${A} ${a.n} · ${e.prof}`;
  $("#h1").textContent=a.titulo; $("#lead").textContent=a.resumo;
  // "prévia" aparece UMA vez, ao lado do título; o aviso longo vai para dentro
  // do resumo recolhido, junto com o resto do contexto.
  if(a.previa){
    $("#tag-previa").outerHTML=`<span class="previa-tag">${esc(T("est.previa"))}</span>`;
    const b=document.createElement("div");b.className="previa";
    b.innerHTML=`<b>${esc(T("aula.previa_b"))}</b> ${esc(a.nota||T("aula.previa_default"))}`;
    $("#lead").after(b);
  }
  $("#obj").innerHTML=a.objetivos.map(o=>`<li>${esc(o)}</li>`).join("");
  $("#conceitos").innerHTML=a.conceitos.map((c,i)=>`<div class="conc"><div class="cn">${i+1}</div><div><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></div></div>`).join("");
  if(a.formulas&&a.formulas.length){
    $("#formulas").innerHTML=`<h2 class="section-h">${T("aula.formulas")}</h2><div class="forms">${a.formulas.map(f=>`
      <div class="form"><div class="fn">${esc(f.nome)} ${f.unidade?`<span class="u">[${esc(f.unidade)}]</span>`:""}</div>
        <code>${esc(f.expr)}</code>
        ${f.vars?`<p><b>${T("aula.where")}</b> ${esc(f.vars)}</p>`:""}
        ${f.quando?`<p><b>${T("aula.why")}</b> ${esc(f.quando)}</p>`:""}</div>`).join("")}</div>`;
  }
  $("#onde-txt").textContent=a.onde.texto;
  try{ if(window.MiniMap) MiniMap.preview(a.onde.scene,$("#mm")); }catch(x){}
  $("#ex-sub").innerHTML=a.exercicios.length
    ?esc(T("aula.ex_sub",{b:idx.bancadas[e.bancada]||e.bancada}))
    :esc(T("aula.ex_none"));
  $("#ex").innerHTML=a.exercicios.map(c=>runBtn(c,idx.comandos[c]||c)).join("");
  document.querySelectorAll("button.runb").forEach(b=>b.addEventListener("click",()=>{
    try{window.parent.postMessage({c5gLab:{runCmd:b.dataset.cmd}},location.origin);}catch(x){}}));
  $("#quiz").innerHTML=a.quiz.map((q,i)=>`<details class="q"><summary>${i+1}. ${esc(q.q)}</summary><p>${esc(q.a)}</p></details>`).join("");
  const prev=K>1?`/lab/estudo/${e.n}/aula/${K-1}`:null, next=K<e.aulas.length?`/lab/estudo/${e.n}/aula/${K+1}`:null;
  $("#nav").innerHTML=`${prev?`<a class="navb" href="${prev}">${T("aula.prev",{n:K-1})}</a>`:"<span></span>"}<a class="navb" href="/lab/estudo/${e.n}">${T("aula.back",{n:e.n})}</a>${next?`<a class="navb primary" href="${next}">${T("aula.next",{n:K+1})}</a>`:"<span></span>"}`;
  $("#footer").innerHTML=a.slide
    ?`${esc(T("aula.src"))} <a href="${GH}${esc(e.pdfs)}/${esc(a.slide)}" target="_blank" rel="noopener">${esc(a.slide)}</a> (${esc(a.fontes)})${esc(T("aula.src_tail",{prof:e.prof}))}`
    :esc(T("aula.src_previa",{f:a.fontes,prof:e.prof}));
}
main().catch(err=>{$("#h1").textContent=T("aula.err");$("#lead").textContent=String(err);});
</script>
</body>
</html>
