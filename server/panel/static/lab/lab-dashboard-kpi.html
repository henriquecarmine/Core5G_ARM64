  .kpi h3{font-size:var(--t-corpo);font-weight:700;line-height:1.3}

<script>
/* ===========================================================================
   Dashboard KPI / NOC — reconstrução do item "data/kpi-dashboard" da plataforma
   de atividades (aula 05 da cadeira 4), no molde de um painel de decisão
   (slide 19): headline, 3 a 5 cartões, UMA série que justifica a decisão,
   alertas, recomendação (SEHAL) e limitações; o resto fica no drill-down.

   DADOS. As 100 amostras são o NOSSO arquivo, não uma transcrição:
     server/oai-cn-gnb-e2/scripts/temas/samples/kpm_ue_tp_sample.jsonl
   (o mesmo dos p2-tema-*). Só /static chega ao navegador, então o conteúdo vai
   embutido em KPM, gerado deste jeito:
     python3 - <<'EOF'
     import json
     R=[json.loads(l) for l in open('server/oai-cn-gnb-e2/scripts/temas/samples/kpm_ue_tp_sample.jsonl')]
     g=lambda v:int(v) if float(v).is_integer() else v
     o={"run_id":R[0]["run_id"],"source":"kpm-ue-tp-sample","campos":["DRB.UEThpUl","DRB.RlcSduDelayDl","RRU.PrbTotUl"]}
     for f in ("baseline","stress","recovery"):
         o[f]=[[g(x["metrics"][c]) for c in o["campos"]] for x in sorted((x for x in R if x["phase"]==f),key=lambda x:x["sample_index"])]
     print(json.dumps(o,separators=(",",":")))
     EOF
   Conferido amostra a amostra contra o bundle do painel original: 0 divergências.

   OVERLAYS. `serie()` reproduz a conta determinista do original (ruído por
   hash de seno, sem Math.random): os valores de S_t, perda, backhaul, atraso e
   vazão por amostra batem com os do painel antigo nos três cenários. O volume
   acumulado saiu (é a soma da vazão, não traz evidência nova).

   O QUE MUDOU EM RELAÇÃO AO ORIGINAL, E POR QUÊ
   1. Os cartões mostravam a ÚLTIMA amostra do stress (S59). No cenário de
      interferência o evento acaba em S42, então os cartões nem mostravam o
      evento. Agora cada cartão resume a JANELA DA DECISÃO (mediana), e o estado
      é o nível mais alto que pelo menos SUST amostras SEGUIDAS atingem.
   2. O alerta de atraso disparava em B01, com a célula ociosa, porque não
      olhava a carga. Agora ele só vale com PRB UL alto e é RELATIVO à mediana
      da mesma carga sem evento: uma razão vale em µs ou em ms.
   3. O atraso era rotulado "ms". O painel trata DRB.RlcSduDelayDl em µs (log de
      Indication, aula 01); a página rotula µs e explica a divergência. Nenhum
      cartão nem conclusão de QoE sai do valor absoluto do atraso.
   4. Alertas e cartões usam os MESMOS limiares escritos, e todo alerta traz a
      regra ao lado.

   GRÁFICOS. Eram 7, um por métrica. Aqui: 1 série da decisão (a que muda o
   diagnóstico em cada cenário) + 5 no drill-down. PRB UL e backhaul dividem um
   gráfico porque são a mesma unidade (% de 0 a 100) — é justamente a comparação
   rádio × transporte. Nunca eixo duplo.
   CORES. As 4 faixas validadas `--serie-N`. Só o gráfico de utilização tem duas
   linhas (PRB = serie-1, backhaul = serie-2, par validado para daltonismo);
   gráfico de uma linha usa serie-3 — o título diz o que é, e seis cores
   distintas não passam na validação.
   =========================================================================== */
const KPM = {"run_id":"ue-tp-20260804-174422","source":"kpm-ue-tp-sample","campos":["DRB.UEThpUl","DRB.RlcSduDelayDl","RRU.PrbTotUl"],"baseline":[[4.46,55,2],[3.72,218,2],[3.72,137,2],[3.72,171,2],[3.72,39,2],[3.72,45,2],[3.72,161,2],[3.72,184,2],[3.7,95,2],[3,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2]],"stress":[[15.16,134.79,2],[79787.77,264.75,97],[74298.14,133.74,99],[82823.86,161.63,99],[80928.66,155.4,99],[77567.93,160.61,99],[80699.91,158.25,99],[79394.26,158.63,99],[79436.41,153.87,99],[79404.48,159.29,99],[80060.69,173.61,99],[79853.9,161.59,99],[79780.77,159.59,99],[78515.58,145.85,99],[79185.02,158.81,99],[82156.06,155.39,99],[79060.13,171.36,99],[80313.02,149.26,99],[80639.18,170.26,99],[80088.72,157.51,99],[80167.22,167.72,99],[79330.18,161.96,99],[82284.39,161.56,99],[81196.07,141.93,99],[81777.18,154.37,99],[81443.46,146.9,99],[79968.72,135.89,99],[80331.03,159.69,99],[81129.86,150.45,99],[77372.11,154.69,99],[79068.26,142.33,99],[79986.66,158.45,99],[81696.05,137.26,99],[82092.61,190.84,99],[80187.61,160.03,99],[81983.9,166.5,99],[79942.97,156.34,99],[80944.26,178.58,99],[81614,153.42,99],[81043.27,185.37,98],[81397.52,160.21,99],[82298.58,151.61,99],[79574.72,164.65,99],[80312.95,164.65,99],[79248.61,161,99],[81252.03,177.44,99],[78660.5,157.56,99],[80223.98,151.7,99],[80918.74,153.18,99],[80681.71,156.55,99],[82184.54,135.41,99],[79330.32,197.1,99],[78482.06,173.21,99],[78508.06,176.24,99],[79166.74,182.97,99],[73893.9,198.07,99],[73730.85,157.66,99],[74542.9,176.99,99],[73830.38,158.99,99],[77216.56,154.88,99]],"recovery":[[172316.9,34,21],[3.72,60,2],[3.72,135,2],[3.72,390,2],[3.72,101,2],[3.72,470,2],[3.72,66,2],[3.72,126,2],[3.7,195,2],[3.72,0,2],[3,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2],[3.72,0,2]]};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const FASES = ["baseline", "stress", "recovery"];
const CENARIOS = ["lab", "interference", "backhaul"];
const SUST = 3;       // "sustentado": amostras SEGUIDAS além do limiar
const QC_THP = 50;    // Mbps — vazão que não cabe numa célula com PRB baixo

// Limiares escritos: os do painel original; os de PRB são os do slide 20.
// `d` = casas da série (tabela, dica); `dc` = casas do cartão.
const MET = {
  prb:   {u: "%",    d: 1, dc: 0, w: 70,  c: 85,  cor: "--serie-1", code: "RRU.PrbTotUl"},
  bh:    {u: "%",    d: 1, dc: 1, w: 75,  c: 90,  cor: "--serie-2"},
  thp:   {u: "Mbps", d: 2, dc: 1, rel: [.85, .60], cor: "--serie-3", code: "DRB.UEThpUl"},
  st:    {u: "",     d: 2, dc: 2, w: 3,   c: 5,   cor: "--serie-3"},
  loss:  {u: "%",    d: 2, dc: 2, w: .5,  c: 1.5, cor: "--serie-3"},
  delay: {u: "µs",   d: 1, dc: 1, k: 1.5,         cor: "--serie-3", code: "DRB.RlcSduDelayDl"},
};
const ICONE = {ok: "✓", warn: "▲", crit: "✕", info: "i"};

// ---------------------------------------------------------------- overlays
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function jn(a, y, r) { const n = Math.sin(a * 12.9898 + y * 78.233) * 43758.5453; return (n - Math.floor(n) - .5) * 2 * r; }

function serie(cen) {
  const am = [];
  FASES.forEach(f => KPM[f].forEach((m, i) => am.push({fase: f, i, thp: m[0], delay: m[1], prb: m[2]})));
  const st = am.map((a, k) => a.fase === "stress" ? k : -1).filter(k => k >= 0);
  const s0 = st[0], s1 = st[st.length - 1], len = Math.max(1, s1 - s0 + 1);
  const iA = s0 + Math.floor(len * .3), iB = s0 + Math.floor(len * .7);      // interferência: miolo do stress
  const bA = s0 + Math.floor(len * .5), bB = Math.min(am.length - 1, s1 + 6); // backhaul: 2ª metade até R05
  return am.map((a, y) => {
    let thp = a.thp / 1000, delay = a.delay, ev = null;
    let bh = clamp(28 + jn(3, y, 4) + a.prb / 100 * 18, 5, 55);
    let sti = .7 + Math.abs(jn(5, y, .35));
    let loss = clamp(.05 + Math.abs(jn(7, y, .04)) + a.prb / 100 * .15, .02, .4);
    if (cen === "interference" && y >= iA && y <= iB) {
      const I = Math.sin((y - iA) / Math.max(1, iB - iA) * Math.PI);
      sti = clamp(7.2 + jn(9, y, 1.6) + Math.abs(jn(19, y, .9)), 5.5, 11.5);
      loss = clamp(.2 + I * 2.2 + Math.abs(jn(11, y, .15)), 0, 6);
      delay = clamp(delay * (1 + .55 * I) + I * 90 + Math.abs(jn(17, y, 12)), 0, 600);
      thp = thp * (1 - .35 * I);
      ev = cen;
    }
    if (cen === "backhaul" && y >= bA && y <= bB) {
      const I = Math.min(1, (y - bA) / Math.max(1, bB - bA) * 1.2);
      bh = clamp(70 + I * 28 + jn(13, y, 2), 5, 99);
      ev = cen;
    }
    return {t: a.fase[0].toUpperCase() + String(a.i).padStart(2, "0"), fase: a.fase, ev,
      prb: Math.round(a.prb * 10) / 10, thp: Math.round(thp * 100) / 100, delay: Math.round(delay * 10) / 10,
      bh: Math.round(bh * 10) / 10, st: Math.round(sti * 100) / 100, loss: Math.round(loss * 100) / 100};
  });
}

// ---------------------------------------------------------------- análise
const med = a => { const v = [...a].sort((x, y) => x - y), m = v.length; return m % 2 ? v[(m - 1) / 2] : (v[m / 2 - 1] + v[m / 2]) / 2; };
const rot = (a, b) => a === b ? a : `${a}–${b}`;

function maiorSeq(arr, p) {               // a sequência mais longa que cumpre p
  let best = null, a = -1;
  arr.forEach((x, k) => {
    if (p(x)) { if (a < 0) a = k; if (!best || k - a > best.b - best.a) best = {a, b: k}; } else a = -1;
  });
  return best && {a: arr[best.a].t, b: arr[best.b].t, n: best.b - best.a + 1};
}
function primeiraSeq(arr, p) {            // a primeira sequência com pelo menos SUST amostras
  let a = -1;
  for (let k = 0; k <= arr.length; k++) {
    if (k < arr.length && p(arr[k])) { if (a < 0) a = k; continue; }
    if (a >= 0 && k - a >= SUST) return {a: arr[a].t, b: arr[k - 1].t, n: k - a};
    a = -1;
  }
  return null;
}

// Níveis de cada regra, do mais grave ao menos: [nível, predicado, limiar, "abaixo"?]
function niveis(k, base) {
  const M = MET[k], carga = x => x.prb > MET.prb.c;
  if (k === "thp") return [["crit", x => carga(x) && x.thp < M.rel[1] * base.thp, M.rel[1] * base.thp, true],
                           ["warn", x => carga(x) && x.thp < M.rel[0] * base.thp, M.rel[0] * base.thp, true]];
  if (k === "delay") return [["warn", x => carga(x) && x.delay >= M.k * base.delay, M.k * base.delay, false]];
  if (k === "bhrisk") return [["warn", x => x.bh > MET.bh.c && x.loss <= MET.loss.w, MET.bh.c, false]];
  return [["crit", x => x[k] > M.c, M.c, false], ["warn", x => x[k] > M.w, M.w, false]];
}
function estado(k, arr, base) {
  const L = niveis(k, base);
  for (const [lv, p, lim, abaixo] of L) { const s = maiorSeq(arr, p); if (s && s.n >= SUST) return {lv, seq: s, lim, abaixo}; }
  const u = L[L.length - 1];
  return {lv: "ok", lim: u[2], abaixo: u[3]};
}
function alertas(S, base) {
  const out = [];
  for (const id of ["prb", "thp", "delay", "st", "loss", "bh", "bhrisk"])
    for (const [lv, p] of niveis(id, base)) { const s = primeiraSeq(S, p); if (s) { out.push({id, lv, seq: s}); break; } }
  const qc = S.filter(x => x.thp > QC_THP && x.prb < MET.prb.w);   // qualidade do dado: basta uma
  if (qc.length) out.push({id: "qc", lv: "info", seq: {a: qc[0].t, b: qc[qc.length - 1].t, n: qc.length, solta: true}});
  const ordem = {crit: 0, warn: 1, info: 2};
  return out.sort((a, b) => ordem[a.lv] - ordem[b.lv]);
}

function analisa(cen) {
  const S = serie(cen);
  const sobCarga = x => x.prb > MET.prb.w;          // carga pelo DADO, não pelo rótulo da fase (S00 tem PRB 2%)
  const semEvento = S.filter(x => sobCarga(x) && !x.ev);
  // Janela da decisão: o stress sustentado (carga) ou o evento dentro do stress.
  const janela = cen === "lab" ? S.filter(x => x.fase === "stress" && sobCarga(x)) : S.filter(x => x.ev && x.fase === "stress");
  // Referência: para a carga, a célula ociosa; para um evento, a MESMA carga sem ele.
  const ref = cen === "lab" ? S.filter(x => x.fase === "baseline") : semEvento;
  const base = {thp: med(semEvento.map(x => x.thp)), delay: med(semEvento.map(x => x.delay))};
  const m = (arr, k) => med(arr.map(x => x[k]));
  const cartoes = ["prb", "thp", "st", "loss", "bh"].map(k => ({k, v: m(janela, k), r: m(ref, k),
    min: Math.min(...janela.map(x => x[k])), max: Math.max(...janela.map(x => x[k])), ...estado(k, janela, base)}));
  return {cen, S, janela, ref, base, cartoes, alertas: alertas(S, base)};
}
const ANALISE = Object.fromEntries(CENARIOS.map(c => [c, analisa(c)]));

  "lim.4": "L'overlay de backhaul est une forme, pas un modèle de trafic : il maintient le lien à {bhR} % ou plus de {bhIni} à {bhEnd}, alors que la cellule est déjà au repos.",
  "lim.5": "Collecte : {s00} est une transition (PRB UL {s00prb} %) et {r00} porte {r00thp} Mbps avec un PRB UL de {r00prb} %. Aucun des deux n'entre dans les fenêtres de décision.",

  "drill.nota": "Un graphique par unité, sans double axe. PRB et backhaul partagent un graphique car tous deux sont en % de 0 à 100. Le volume cumulé du tableau d'origine a été retiré : c'est la somme du débit, sans preuve nouvelle.",
  "g.util": "Utilisation (%)", "g.thp": "Débit UL (Mbps)", "g.st": "Interférence S_t (score)", "g.loss": "Perte de paquets (%)", "g.delay": "Délai RLC DL (µs)",
  "g.delaynota": "Unité µs (voir Limites). La ligne pointillée est la règle de l'alerte de délai.",
  "s.prb": "PRB UL", "s.bh": "Backhaul", "s.thp": "Débit UL", "s.st": "S_t", "s.loss": "Perte", "s.delay": "Délai RLC",
  "t.ver": "voir le tableau", "t.ocultar": "masquer le tableau", "t.amostra": "Échantillon", "t.fase": "Phase", "t.evento": "Événement",
  "ev.interference": "interférence RF (synthétique)", "ev.backhaul": "saturation du backhaul (synthétique)", "banda.evento": "événement synthétique",
  "lim.atencao": "attention", "lim.critico": "critique", "lim.delay": "{k} × charge sans événement",
  "g.aria": "{t}. Les flèches parcourent les échantillons.",
  "pe.aula": "Revoir le cours 05", "pe.ex": "Faire l'exercice",
  "pe.nota": "Reconstruction du tableau de bord KPI / NOC de la plateforme d'activités, avec les mêmes overlays déterministes et trois corrections : les cartes résument la fenêtre de décision, et non le dernier échantillon ; l'alerte de délai ne vaut que sous charge et est relative ; le délai est étiqueté en µs."
}
};

let LANG = "pt";
const LOC = {pt: "pt-BR", en: "en-US", es: "es-ES", fr: "fr-FR"};
function T(k, p) {
  let s = (D[LANG] && D[LANG][k] != null) ? D[LANG][k] : (D.pt[k] != null ? D.pt[k] : k);
  if (p) for (const n in p) s = s.split("{" + n + "}").join(p[n]);
  return s;
}
const fmt = (v, d = 2) => new Intl.NumberFormat(LOC[LANG] || "pt-BR", {maximumFractionDigits: d}).format(v);
const un = u => u === "%" ? (LANG === "fr" ? " %" : "%") : (u ? " " + u : "");
// o sinal segue o número JÁ ARREDONDADO: "+0 Mbps" diria que algo subiu
const sinal = (v, txt) => (/^0(?:[.,]0*)?(?:\s|$)/.test(txt) ? "±" : v > 0 ? "+" : v < 0 ? "−" : "±") + txt;

// ---------------------------------------------------------------- gráficos
let GRAFS = [], NG = 0;

function escala(max) {
  if (!(max > 0)) max = 1;
  const bruto = max / 4, mag = Math.pow(10, Math.floor(Math.log10(bruto))), nrm = bruto / mag;
  const passo = (nrm <= 1 ? 1 : nrm <= 2 ? 2 : nrm <= 2.5 ? 2.5 : nrm <= 5 ? 5 : 10) * mag;
  const hi = Math.ceil(max / passo - 1e-9) * passo, ticks = [];
  for (let i = 0; i * passo <= hi + 1e-9; i++) ticks.push(+(i * passo).toFixed(6));
  return {hi, ticks};
}

function montaGrafico(host, cfg) {
  const g = {cfg, id: ++NG, idx: null, W: 0};
  const legenda = cfg.series.length > 1
    ? `<div class="legenda">${cfg.series.map(k => `<span><i style="background:var(${MET[k].cor})"></i>${esc(T("s." + k))}</span>`).join("")}</div>` : "";
  host.innerHTML = `${legenda}<div class="area"></div><button type="button" class="vertab" aria-expanded="false">${esc(T("t.ver"))}</button><div class="tabwrap" hidden></div>`;
  g.area = $(".area", host);
  const bt = $(".vertab", host), tw = $(".tabwrap", host);
  bt.addEventListener("click", () => {
    const abrir = tw.hidden;
    if (abrir && !tw.firstChild) tw.innerHTML = tabelaHTML(cfg);
    tw.hidden = !abrir;
    bt.setAttribute("aria-expanded", String(abrir));
    bt.textContent = T(abrir ? "t.ocultar" : "t.ver");
  });
  GRAFS.push(g);
  desenha(g);
}

function tabelaHTML(cfg) {
  const S = cfg.S, temEv = S.some(x => x.ev);
  const cab = `<tr><th>${esc(T("t.amostra"))}</th><th>${esc(T("t.fase"))}</th>${temEv ? `<th>${esc(T("t.evento"))}</th>` : ""}`
    + cfg.series.map(k => `<th class="num">${esc(T("s." + k))}${MET[k].u ? ` (${esc(MET[k].u)})` : ""}</th>`).join("") + "</tr>";
  const lin = S.map(x => `<tr><td>${x.t}</td><td>${x.fase}</td>${temEv ? `<td>${x.ev ? esc(T("ev." + x.ev)) : ""}</td>` : ""}`
    + cfg.series.map(k => `<td class="num">${fmt(x[k], MET[k].d)}</td>`).join("") + "</tr>").join("");
  return `<table><caption class="sr">${esc(cfg.titulo)}</caption><thead>${cab}</thead><tbody>${lin}</tbody></table>`;
}

function desenha(g) {
  const W = Math.floor(g.area.clientWidth);
  if (!W || W === g.W) return;              // escondido (drill-down fechado) ou sem mudança
  g.W = W;
  const {S, series, lims = [], dom} = g.cfg;
  const H = g.cfg.alto || 190, mL = 42, mR = 8, mT = 20, mB = 22;
  const pw = W - mL - mR, ph = H - mT - mB, n = S.length, passo = pw / (n - 1);
  const X = i => mL + i * passo;
  let hi, ticks;
  if (dom) { hi = 100; ticks = [0, 25, 50, 75, 100]; }
  // o limiar entra na escala com folga, para a linha e o rótulo não colarem no topo
  else ({hi, ticks} = escala(Math.max(...series.flatMap(k => S.map(x => x[k])), ...lims.map(l => l.v * 1.15))));
  const Y = v => mT + ph - v / hi * ph;
  const r1 = v => Math.round(v * 10) / 10;
  let s = "";

  // faixas de fase: baseline | stress (sombreado) | recovery
  const blocos = FASES.map(fz => { const i0 = S.findIndex(x => x.fase === fz); let i1 = i0; while (i1 + 1 < n && S[i1 + 1].fase === fz) i1++; return {fz, i0, i1}; });
  for (const b of blocos) {
    const x0 = Math.max(mL, X(b.i0) - passo / 2), x1 = Math.min(mL + pw, X(b.i1) + passo / 2);
    if (b.fz === "stress") s += `<rect class="banda" x="${r1(x0)}" y="${mT}" width="${r1(x1 - x0)}" height="${ph}"/>`;
    if (b.i0 > 0) s += `<line class="sep" x1="${r1(x0)}" x2="${r1(x0)}" y1="${mT - 16}" y2="${mT + ph}"/>`;
    s += `<text class="fase-t" x="${r1((x0 + x1) / 2)}" y="${mT - 6}" text-anchor="middle">${b.fz}</text>`;
  }
  for (const v of ticks)
    s += `<line class="grade" x1="${mL}" x2="${mL + pw}" y1="${r1(Y(v))}" y2="${r1(Y(v))}"/><text class="eixo" x="${mL - 6}" y="${r1(Y(v) + 3)}" text-anchor="end">${fmt(v, 2)}</text>`;

  // janela do evento sintético: hachura a 45°, para não competir com as fases
  const ev = S.map((x, i) => x.ev ? i : -1).filter(i => i >= 0);
  if (ev.length) {
    const x0 = X(ev[0]) - passo / 2, x1 = Math.min(mL + pw, X(ev[ev.length - 1]) + passo / 2);
    s += `<defs><pattern id="hach${g.id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hach" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>`
      + `<rect x="${r1(x0)}" y="${mT}" width="${r1(x1 - x0)}" height="${ph}" fill="url(#hach${g.id})"/>`
      + `<line class="ev-borda" x1="${r1(x0)}" x2="${r1(x0)}" y1="${mT}" y2="${mT + ph}"/><line class="ev-borda" x1="${r1(x1)}" x2="${r1(x1)}" y1="${mT}" y2="${mT + ph}"/>`
      // rótulo embaixo: no início de cada janela as séries estão longe do zero (em cima, o backhaul a 98% o riscava)
      + `<text class="ev-t" x="${r1(x0 + 4)}" y="${mT + ph - 6}">${esc(T("banda.evento"))}</text>`;
  }
  for (const l of lims) if (l.v <= hi) {
    const yy = r1(Y(l.v));
    // rótulo à esquerda: no baseline todas as séries ficam abaixo dos limiares; à direita, os picos do recovery o cortavam
    s += `<line class="lim-l" x1="${mL}" x2="${mL + pw}" y1="${yy}" y2="${yy}"/><text class="lim-t" x="${mL + 4}" y="${yy - 4}">${esc(l.t)}</text>`;
  }
  for (const k of series)
    s += `<path class="linha" style="stroke:var(${MET[k].cor})" d="${S.map((x, i) => `${i ? "L" : "M"}${r1(X(i))} ${r1(Y(x[k]))}`).join("")}"/>`;
  const marcas = [0, ...blocos.slice(1).map(b => b.i0), n - 1];
  marcas.forEach((i, j) => {
    const anc = j === 0 ? "start" : j === marcas.length - 1 ? "end" : "middle";
    s += `<text class="eixo" x="${r1(X(i))}" y="${H - 6}" text-anchor="${anc}">${S[i].t}</text>`;
  });
  s += `<g class="cursor" visibility="hidden"><line class="cruz" y1="${mT}" y2="${mT + ph}"/>${series.map(k => `<circle class="ponto" r="4" style="fill:var(${MET[k].cor})"/>`).join("")}</g>`;

  g.area.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" tabindex="0" role="img" aria-label="${esc(T("g.aria", {t: g.cfg.titulo}))}">${s}</svg><div class="dica" hidden></div>`;
  const svg = $("svg", g.area), cur = $(".cursor", svg), dica = $(".dica", g.area);

  // dica: o valor na frente, o rótulo atrás; texto via textContent
  const mostra = i => {
    i = g.idx = Math.max(0, Math.min(n - 1, i));
    const x = X(i), ln = $("line", cur);
    cur.setAttribute("visibility", "visible");
    ln.setAttribute("x1", x); ln.setAttribute("x2", x);
    cur.querySelectorAll("circle").forEach((c, j) => { c.setAttribute("cx", x); c.setAttribute("cy", Y(S[i][series[j]])); });
    dica.replaceChildren();
    for (const k of series) {
      const row = document.createElement("div"), key = document.createElement("i"), v = document.createElement("span");
      key.className = "k"; key.style.background = `var(${MET[k].cor})`;
      v.className = "v"; v.textContent = fmt(S[i][k], MET[k].d) + un(MET[k].u);
      row.append(key, v);
      if (series.length > 1) { const l = document.createElement("span"); l.className = "l"; l.textContent = " " + T("s." + k); row.append(l); }
      dica.append(row);
    }
    const onde = document.createElement("div");
    onde.className = "onde";
    onde.textContent = [S[i].t, S[i].fase, S[i].ev ? T("ev." + S[i].ev) : ""].filter(Boolean).join(" · ");
    dica.append(onde);
    dica.hidden = false;
    const esc_ = svg.getBoundingClientRect().width / W, dw = dica.offsetWidth, px = x * esc_;
    let left = px + 12;
    if (left + dw > g.area.clientWidth) left = px - 12 - dw;
    dica.style.left = Math.max(0, left) + "px";
    dica.style.top = (mT + 4) * esc_ + "px";
  };
  const esconde = () => { cur.setAttribute("visibility", "hidden"); dica.hidden = true; };
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    mostra(Math.round(((e.clientX - r.left) * W / r.width - mL) / passo));
  });
  svg.addEventListener("pointerleave", esconde);
  svg.addEventListener("focus", () => mostra(g.idx ?? 0));
  svg.addEventListener("blur", esconde);
  svg.addEventListener("keydown", e => {
    const d = {ArrowLeft: -1, ArrowRight: 1, Home: -n, End: n}[e.key];
    if (d == null) return;
    e.preventDefault();
    mostra((g.idx ?? 0) + d);
  });
}

function limiares(k, A) {
  const M = MET[k];
  if (M.c != null) return [{v: M.w, t: `${T("lim.atencao")} ${fmt(M.w)}${un(M.u)}`}, {v: M.c, t: `${T("lim.critico")} ${fmt(M.c)}${un(M.u)}`}];
  if (k === "delay") return [{v: M.k * A.base.delay, t: T("lim.delay", {k: fmt(M.k)})}];
  return [];
}

// ---------------------------------------------------------------- tela
function cartaoHTML(c, A) {
  const M = MET[c.k], dc = M.dc;
  const src = c.k === "prb" ? "kpm" : c.k === "thp" ? (A.cen === "interference" ? "kpmov" : "kpm") : "syn";
  const fonte = src === "syn" ? `<span class="sint">${esc(T("src.syn"))}</span>` : `${esc(T("src." + src))} · <code>${M.code}</code>`;
  const dv = c.v - c.r;
  let delta;
  if (M.u === "%") delta = sinal(dv, `${fmt(Math.abs(dv), dc)} ${T("u.pp")}`);
  else if (c.k === "thp") delta = sinal(dv, `${fmt(Math.abs(dv), 1)} Mbps`) + (c.r >= 1 ? ` (${sinal(dv, fmt(Math.abs(dv / c.r * 100), 0))}${un("%")})` : "");
  else delta = sinal(dv, fmt(Math.abs(dv), dc));
  const lim = c.k === "thp"
    ? T("c.limthp", {w: fmt(M.rel[0] * A.base.thp, 1), c: fmt(M.rel[1] * A.base.thp, 1)})
    : T("c.lim", {w: fmt(M.w), c: fmt(M.c), u: un(M.u)});
  const por = c.lv === "ok" ? T("c.porok", {s: SUST})
    : T(c.abaixo ? "c.porabaixo" : "c.poracima", {n: c.seq.n, v: fmt(c.lim, dc), u: un(M.u)});
  const win = rot(A.janela[0].t, A.janela[A.janela.length - 1].t);
  return `<article class="kpi" data-lv="${c.lv}">
    <h3>${esc(T("k." + c.k))}</h3>
    <div class="fonte-k">${fonte}</div>
    <div class="valor">${fmt(c.v, dc)}<small>${esc(M.u)}</small></div>
    <div class="janela">${esc(T("c.janela", {win, a: fmt(c.min, dc), b: fmt(c.max, dc)}))}</div>
    <div class="delta">${esc(delta)} <span>${esc(T(A.cen === "lab" ? "vs.base" : "vs.load"))}</span></div>
    <div class="limiar">${esc(lim)}</div>
    <div class="estado" data-lv="${c.lv}"><span class="ic" aria-hidden="true">${ICONE[c.lv]}</span><b>${esc(T("lv." + c.lv))}</b><span class="por">${esc(por)}</span></div>
  </article>`;
}

function alertaHTML(a, A) {
  const M = MET[a.id] || {};
  const p = a.id === "thp" ? {p: fmt(MET.prb.c), w: fmt(MET.thp.rel[0] * A.base.thp, 1), c: fmt(MET.thp.rel[1] * A.base.thp, 1)}
    : a.id === "delay" ? {p: fmt(MET.prb.c), k: fmt(MET.delay.k), ref: fmt(A.base.delay, 1)}
    : a.id === "bhrisk" ? {c: fmt(MET.bh.c), w: fmt(MET.loss.w)}
    : a.id === "qc" ? {q: fmt(QC_THP), w: fmt(MET.prb.w)}
    : {c: fmt(M.c), w: fmt(M.w)};
  const onde = a.seq.solta ? (a.seq.n === 1 ? T("a.onde1", {a: a.seq.a}) : T("a.onden", a.seq)) : T("a.onde", a.seq);
  return `<li class="alerta">
    <div class="alerta-topo"><span class="estado" data-lv="${a.lv}"><span class="ic" aria-hidden="true">${ICONE[a.lv]}</span><b>${esc(T("lv." + a.lv))}</b></span>
      <h3>${esc(T("a." + a.id + ".t"))}</h3><span class="onde">${esc(onde)}</span></div>
    <p class="regra"><b>${esc(T("a.regra"))}</b> ${esc(T("a." + a.id + ".r", p))}</p>
    <p class="det">${esc(T("a." + a.id + ".d"))}</p></li>`;
}

function params(A) {
  const w = A.janela, cv = k => A.cartoes.find(c => c.k === k), thp = cv("thp");
  const drop = thp.r >= 1 ? Math.round((thp.v - thp.r) / thp.r * 100) : 0;
  const ev = A.S.filter(x => x.ev);
  return {win: rot(w[0].t, w[w.length - 1].t), a: w[0].t, n: w.length,
    prb: fmt(cv("prb").v, 0), prbRef: fmt(cv("prb").r, 0), thp: fmt(thp.v, 1), thpRef: fmt(thp.r, 1),
    st: fmt(cv("st").v, 2), stRef: fmt(cv("st").r, 2), loss: fmt(cv("loss").v, 2), lossRef: fmt(cv("loss").r, 2), bh: fmt(cv("bh").v, 1),
    drop: (drop > 0 ? "+" : drop < 0 ? "−" : "±") + Math.abs(drop),
    bhFirst: fmt(w[0].bh, 1), bhmax: fmt(Math.max(...w.map(x => x.bh)), 1),
    runPrb: cv("prb").seq ? cv("prb").seq.n : 0, runBh: cv("bh").seq ? cv("bh").seq.n : 0,
    pc: fmt(MET.prb.c), bc: fmt(MET.bh.c), bw: fmt(MET.bh.w), sw: fmt(MET.st.w),
    bhEnd: ev.length ? ev[ev.length - 1].t : ""};
}

function paramsLimites() {
  const lab = ANALISE.lab.S, bh = ANALISE.backhaul.S;
  const carga = lab.filter(x => x.prb > MET.prb.w);
  const ocioso = lab.filter(x => x.fase === "baseline" && x.delay > 0);
  const bhRec = bh.filter(x => x.ev && x.fase === "recovery");
  const s00 = lab.find(x => x.fase === "stress"), qc = lab.find(x => x.thp > QC_THP && x.prb < MET.prb.w);
  const tam = CENARIOS.map(c => ANALISE[c].janela.length);
  return {n: lab.length, ns: lab.filter(x => x.fase === "stress").length, s: SUST, wmin: Math.min(...tam), wmax: Math.max(...tam),
    bhR: fmt(Math.min(...bhRec.map(x => x.bh)), 1), bhIni: bhRec[0].t, bhEnd: bhRec[bhRec.length - 1].t,
    s00: s00.t, s00prb: fmt(s00.prb, 0), r00: qc.t, r00thp: fmt(qc.thp, 1), r00prb: fmt(qc.prb, 0),
    dl: fmt(med(carga.map(x => x.delay)), 1), di: fmt(med(ocioso.map(x => x.delay)), 0), dia: ocioso[0].t, dib: ocioso[ocioso.length - 1].t};
}

const DRILL = [{id: "util", series: ["prb", "bh"], dom: true}, {id: "thp", series: ["thp"]}, {id: "st", series: ["st"]},
               {id: "loss", series: ["loss"]}, {id: "delay", series: ["delay"]}];
// A série da decisão é a que muda o diagnóstico em cada cenário.
const DECISAO = {lab: "prb", interference: "st", backhaul: "bh"};
let CEN = CENARIOS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "lab";

function renderCenario() {
  const A = ANALISE[CEN], P = params(A);
  document.querySelectorAll("#cenarios button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === CEN)));
  $("#headline").textContent = T("hl." + CEN, P);
  $("#kpisNota").textContent = T("kpis.nota", {win: P.win, n: P.n, s: SUST, ref: CEN === "lab" ? T("ref.base") : T("ref.load", {n: A.ref.length})});
  $("#kpis").innerHTML = A.cartoes.map(c => cartaoHTML(c, A)).join("");
  $("#serieNota").textContent = T("serie." + CEN, P);
  $("#alertas").innerHTML = A.alertas.map(a => alertaHTML(a, A)).join("");
  $("#sehal").innerHTML = ["S", "E", "H", "A", "L"].map(l =>
    `<div><dt><span class="letra">${l}</span>${esc(T("sehal." + l))}</dt><dd>${esc(T(CEN + "." + l, P))}</dd></div>`).join("");

  GRAFS = [];
  const dk = DECISAO[CEN];
  montaGrafico($("#gDecisao"), {S: A.S, series: [dk], titulo: T("k." + dk), alto: 230, dom: MET[dk].u === "%", lims: limiares(dk, A)});
  $("#grafs").innerHTML = DRILL.map(d => `<div class="graf-card"><h3>${esc(T("g." + d.id))}</h3>`
    + (d.id === "delay" ? `<p class="nota">${esc(T("g.delaynota"))}</p>` : "") + `<div class="graf" data-g="${d.id}"></div></div>`).join("");
  DRILL.forEach(d => montaGrafico($(`[data-g="${d.id}"]`),
    {S: A.S, series: d.series, dom: d.dom, titulo: T("g." + d.id), lims: d.series.length > 1 ? [] : limiares(d.series[0], A)}));
}

function renderEstatico() {
  LANG = (window.LABI18N && LABI18N.lang) || "pt";
  document.documentElement.lang = LOC[LANG] ? (LANG === "pt" ? "pt-BR" : LANG) : "pt-BR";
  document.title = T("title");
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T(e.dataset.t); });
  $("#themeBtn").title = T("tema");
  $("#themeBtn").setAttribute("aria-label", T("tema"));
  $("#lead").textContent = T("lead");
  $("#origem").textContent = T("origem", {src: KPM.source, run: KPM.run_id, n: FASES.reduce((s, f) => s + KPM[f].length, 0),
    nb: KPM.baseline.length, ns: KPM.stress.length, nr: KPM.recovery.length});
  const cen = $("#cenarios");
  cen.setAttribute("aria-label", T("cen.aria"));
  cen.innerHTML = CENARIOS.map(c => `<button type="button" data-c="${c}">${esc(T("cen." + c))}</button>`).join("");
  cen.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    CEN = b.dataset.c;
    history.replaceState(null, "", "#" + CEN);
    renderCenario();
  }));
  const PL = paramsLimites();
  $("#limLista").innerHTML = ["lim.1", "lim.2", "lim.3", "lim.4", "lim.5", "lim.6"].map(k => `<li>${esc(T(k, PL))}</li>`).join("");
  $("#unidTexto").innerHTML = T("unid.d");     // texto nosso, com <code>
  $("#alertasNota").textContent = T("alertas.nota", {s: SUST});
  $("#drillNota").textContent = T("drill.nota");
  $("#peNota").textContent = T("pe.nota");
}

// As siglas se explicam uma vez por página, no texto que não muda com o cenário.
function explicaSiglas() {
  try { if (window.Glossario) Glossario.marcar([$("#lead"), $("#limites"), $("#drillNota")], {umaVez: true}); }
  catch (e) { console.warn("glossário:", e); }
}

function render() { renderEstatico(); renderCenario(); explicaSiglas(); }

$("#themeBtn").addEventListener("click", () => {
  // o tema é do ALUNO, não da página: mesma chave do painel
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("c5g-theme", next); } catch (e) {}
});
$("#drill").addEventListener("toggle", () => GRAFS.forEach(desenha));
new ResizeObserver(() => GRAFS.forEach(desenha)).observe($("#wrap"));
if (window.LABI18N) LABI18N.onChange(render);
render();
</script>
</body>
</html>
