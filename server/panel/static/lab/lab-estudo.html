<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudo · Core5G_ARM64</title>
<link rel="stylesheet" href="/static/lab/lab-estudos.css?v=0.72.0">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <a href="/" class="back" data-i18n="nav.back">← Painel</a> <span class="sep">·</span> <a href="/lab" class="back" data-i18n="est.back_lab">Lab de IA</a>
      <div class="eyebrow" id="eyebrow" data-i18n="est.word">Estudo</div>
      <h1 id="h1">…</h1>
      <p class="lead" id="lead"></p>
    </div>
    <div class="topright"><div id="langsel" class="langsel"></div><button class="themebtn" id="themeBtn" title="Tema" aria-label="Alternar tema">◐</button></div>
  </div>

  <div class="meta" id="meta"></div>

  <div id="dados"></div>
  <div id="temas"></div>

  <h2 class="section-h" id="aulas-h" data-i18n="est.aulas">Aulas</h2>
  <p class="sub" id="aulas-sub"></p>
  <div class="steps" id="aulas"></div>

  <h2 class="section-h" data-i18n="est.ex_console">Exercícios no console</h2>
  <p class="sub" id="ex-sub"></p>
  <div class="exlist" id="ex"></div>

  <div id="proximas"></div>
  <div id="atividades"></div>

  <footer id="footer"></footer>
</div>

<script src="/static/lab/lab-i18n.js?v=0.72.0"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const T=(k,p)=>window.LABI18N?LABI18N.t(k,p):k;
const LANG=(window.LABI18N&&LABI18N.lang)||"pt";
async function jl(name){if(LANG!=="pt"){try{const r=await fetch(`/static/lab/estudos/${name}.${LANG}.json`,{cache:"no-store"});if(r.ok)return r.json();}catch(x){}}return (await fetch(`/static/lab/estudos/${name}.json`,{cache:"no-store"})).json();}
if(window.LABI18N)LABI18N.onChange(()=>location.reload());
const EMBED=new URLSearchParams(location.search).has("embed");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const GH="https://github.com/henriquecarmine/Core5G_ARM64/tree/main/";
const N=parseInt((location.pathname.match(/\/lab\/estudo\/(\d)/)||[])[1]||"4",10);
const withEmbed=u=>u+(EMBED?(u.includes("?")?"&":"?")+"embed=1":"");

if(EMBED){document.documentElement.classList.add("embed");
  try{const th=window.parent.document.documentElement.getAttribute("data-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}}
$("#themeBtn").addEventListener("click",()=>{const c=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",c==="dark"?"light":"dark");});
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="/lab"]');
  if(a&&EMBED){const u=a.getAttribute("href");if(u&&!u.includes("embed=1")){e.preventDefault();location.href=withEmbed(u);}}},true);

function runBtn(cmd,label,any){
  if(EMBED) return `<button class="runb" data-cmd="${esc(cmd)}" title="${esc(cmd)}">▶ ${esc(label)}</button>`;
  return `<a class="runb ghost" href="/" title="${esc(T("est.run_hint"))}">▶ ${esc(label)} <small>${esc(T("est.in_panel"))}</small></a>`;
}
function wireRun(root){
  root.querySelectorAll("button.runb").forEach(b=>b.addEventListener("click",()=>{
    try{window.parent.postMessage({c5gLab:{runCmd:b.dataset.cmd}},location.origin);}catch(e){}
  }));
}

async function main(){
  const idx=await jl("index");
  const e=idx.estudos.find(x=>x.n===N)||idx.estudos[3];
  document.title=`${T("est.word")} ${e.n} · ${e.titulo}`;
  try{if(EMBED)window.parent.postMessage({c5gLab:{title:`${T("est.word")} ${e.n} · ${e.titulo}`}},location.origin);}catch(x){}
  $("#eyebrow").textContent=`${T("est.word")} ${e.n} · ${e.prof}`;
  $("#h1").textContent=`${e.icon} ${e.titulo}`;
  $("#lead").textContent=e.resumo;
  $("#meta").innerHTML=`
    <span class="chip"><b>${T("est.bancada")}</b> ${esc(idx.bancadas[e.bancada]||e.bancada)}</span>
    <span class="chip"><b>${T("est.periodo")}</b> ${esc(e.periodo||"")}</span>
    <a class="chip" href="${GH}${esc(e.pdfs)}" target="_blank" rel="noopener"><b>${T("est.slides")}</b> ${esc(e.pdfs)} ↗</a>
    ${e.lab?`<a class="chip" href="${e.lab}"><b>Lab</b> ${T("est.lab_chip")}</a>`:""}`;

  // ---- aulas (detalhadas, extraídas dos slides) ou páginas do Lab de IA (Estudo 3)
  if(e.externas){
    $("#aulas-sub").textContent=T("est.externas_sub");
    $("#aulas").innerHTML=e.externas.map((a,i)=>`
      <div class="step"><div class="stepnum">${i}</div>
        <div class="stepbody"><h4>${a.icon} ${esc(a.titulo)}</h4><p>${esc(a.one)}</p></div>
        <a class="stepgo" href="${a.href}">${T("est.open")}</a></div>`).join("");
  } else {
    $("#aulas-sub").textContent=(e.nota?e.nota+" ":"")+T("est.aulas_sub");
    const aulas=await Promise.all(e.aulas.map(id=>jl(id).catch(()=>null)));
    $("#aulas").innerHTML=aulas.filter(Boolean).map(a=>`
      <div class="step"><div class="stepnum">${a.n}</div>
        <div class="stepbody"><h4>${esc(a.titulo)}${a.previa?` <span class="previa-tag">${esc(T("est.previa"))}</span>`:""}</h4><p>${esc(a.resumo)}</p>
          <div class="oran">${T("est.stats",{c:a.conceitos.length,f:a.formulas.length,x:a.exercicios.length})} · ${a.slide?esc(a.slide):esc(T("est.noslides"))}</div></div>
        <a class="stepgo" href="/lab/estudo/${e.n}/aula/${a.n}">${T("est.open_aula")}</a></div>`).join("");
  }

  // ---- exercícios (comandos do console)
  $("#ex-sub").innerHTML=e.bancada==="p2"
    ?T("est.ex_p2")+(e.temas?T("est.ex_p2_temas"):"")
    :T("est.ex_p1");
  $("#ex").innerHTML=e.exercicios.map(c=>runBtn(c,idx.comandos[c]||c)).join("");

  // ---- Estudo 4: dados do projeto + os 7 temas + próximas aulas
  if(e.dados){
    const d=e.dados;
    $("#dados").innerHTML=`
      <div class="card">
        <h2>${T("est.dados_h")}</h2>
        <p>${esc(d.fonte)}</p>
        <table class="tbl"><tr><th>${T("est.col")}</th><th>${T("est.kpm")}</th><th>${T("est.oque")}</th><th>${T("est.unid")}</th></tr>
          ${d.metricas.map(m=>`<tr><td><code>${esc(m.k)}</code></td><td><code>${esc(m.kpm)}</code></td><td>${esc(m.o)}</td><td>${esc(m.u)}</td></tr>`).join("")}
        </table>
        <p class="note">${esc(d.troca)}</p>
      </div>`;
  }
  if(e.temas){
    $("#temas").innerHTML=`
      <h2 class="section-h">${T("est.temas_h")}</h2>
      <p class="sub">${T("est.temas_sub")}</p>
      <div class="temas">
        ${e.temas.map(t=>`
          <div class="tema">
            <div class="tema-h"><span class="tema-ic">${t.icon}</span><div><h3>${esc(t.titulo)}</h3>${t.grupo?`<div class="grupo">${esc(t.grupo)}</div>`:""}</div></div>
            <p class="perg">${esc(t.pergunta)}</p>
            <div class="inds">
              ${t.ind.map((i,k)=>`<div class="ind"><div class="ind-n">${T("est.ind")} ${k+1} · ${esc(i.nome)} <span class="u">[${esc(i.u)}]</span></div><code>${esc(i.formula)}</code></div>`).join("")}
            </div>
            <p class="extra">${esc(t.extra)}</p>
            <p class="rec"><b>${T("est.rec")}</b> ${esc(t.rec)}</p>
            ${runBtn(t.cmd,T("est.run_tema",{id:t.id.toUpperCase()}))}
          </div>`).join("")}
      </div>
      <div class="allrow">${runBtn("p2-tema-all",T("est.all"))}</div>`;
  }
  // ---- exercícios do professor (Plataforma de Atividades da CESAR School)
  if(e.atividades&&idx.plataforma){
    const A=e.atividades,P=idx.plataforma;
    const naPlat=h=>esc(P.url+(h||""));
    const platLink=`<a href="${naPlat("")}" target="_blank" rel="noopener">${esc(P.nome)}</a>`;
    const prep=p=>{
      if(!p)return"";
      const b=[];
      if(p.aula)b.push(`<a class="prepl" href="/lab/estudo/${e.n}/aula/${p.aula}">${esc(T("est.ativ_aula",{n:p.aula}))}</a>`);
      if(p.href)b.push(`<a class="prepl" href="${esc(p.href)}">${esc(p.rot)}</a>`);
      if(p.cmd)b.push(runBtn(p.cmd,idx.comandos[p.cmd]||p.cmd));
      return b.length?`<div class="ativ-prep"><span>${T("est.ativ_prep")}</span>${b.join("")}</div>`:"";
    };
    $("#atividades").innerHTML=`
      <h2 class="section-h">${T("est.ativ_h")}</h2>
      <p class="sub">${A.cruzada?T("est.ativ_cruzada",{modulo:esc(A.modulo)}):T("est.ativ_sub",{modulo:esc(A.modulo),plat:platLink})}</p>
      <p class="ativ-nota">${T("est.ativ_nota")}</p>
      <div class="ativs">
        ${A.itens.map(x=>`
          <div class="ativ">
            <div class="ativ-rot">${esc(x.rot)}</div>
            <h4>${esc(x.t)}</h4>
            <p>${esc(x.d)}</p>
            <a class="ativ-go" href="${naPlat(x.h)}" target="_blank" rel="noopener">${T("est.ativ_open")}</a>
            ${prep(x.prep)}
          </div>`).join("")}
      </div>
      <div class="allrow"><a class="runb ghost" href="${naPlat(A.hash)}" target="_blank" rel="noopener">${esc(T("est.ativ_all",{modulo:A.modulo}))}</a></div>`;
    wireRun($("#atividades"));
  }
  if(e.proximas){
    $("#proximas").innerHTML=`<h2 class="section-h">${T("est.proximas")}</h2>
      <div class="steps">${e.proximas.map(p=>`<div class="step soon"><div class="stepnum">${p.n}</div><div class="stepbody"><h4>${esc(p.data)}</h4><p>${esc(p.t)}</p></div></div>`).join("")}</div>`;
  }
  wireRun(document);
  $("#footer").innerHTML=esc(T("est.footer",{prof:e.prof}));
}
main().catch(err=>{$("#h1").textContent=T("est.err");$("#lead").textContent=String(err);});
</script>
</body>
</html>
