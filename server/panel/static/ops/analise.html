<meta charset="utf-8">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<!doctype html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análise · Core5G_ARM64</title>
<script>document.documentElement.dataset.theme = localStorage.getItem("c5g-theme") || "dark";</script>
<link rel="stylesheet" href="/static/tokens.css?v=0.79.0">
<script src="/static/i18n.js"></script>
<style>
  /* =====================================================================
     Analisador do laboratório. Não é uma parede de badges: cada assunto é um
     QUADRANTE com moldura e etiqueta encaixada, e dentro dele há LEITURA —
     número, escala e o que aquilo quer dizer.

     A voz aqui é a do instrumento (monoespaçada, densa, medida em células),
     como manda docs/identidade-visual.md. Toda cor vem de papel; nenhuma
     escrita à mão.
     ===================================================================== */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:var(--fonte-instrumento);font-size:var(--t-corpo)}
  a{color:var(--accent-text)}

  .topo{display:flex;align-items:center;gap:var(--e-3);flex-wrap:wrap;
        padding:var(--e-3) var(--e-5);border-bottom:var(--traco) solid var(--line);
        background:var(--surface)}
  .marca{font-weight:700;font-size:var(--t-base);letter-spacing:-.01em}
  .marca b{color:var(--accent-text)}
  .voltar{font-size:var(--t-mini);font-weight:700;text-decoration:none}
  .sep{color:var(--ink-3)}
  .estado{display:inline-flex;align-items:center;gap:var(--e-2);margin-left:auto;
          font-size:var(--t-mini);font-weight:700}
  .relogio{font-size:var(--t-mini);color:var(--ink-3);font-variant-numeric:tabular-nums}
  .btn{border:var(--traco) solid var(--line-strong);background:transparent;color:var(--ink-2);
       border-radius:var(--r-sm);padding:5px 11px;font:inherit;font-size:var(--t-mini);
       font-weight:700;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent-text)}

  .grade{display:grid;gap:var(--e-4);padding:var(--e-5);
         grid-template-columns:repeat(auto-fit,minmax(330px,1fr));align-items:start}
  .larga{grid-column:1/-1}

  /* o quadrante: a assinatura da identidade — moldura com etiqueta encaixada */
  .q{position:relative;border:var(--traco) solid var(--line);border-radius:var(--r-md);
     background:var(--surface);padding:var(--e-4) var(--e-4) var(--e-3)}
  .q>.et{position:absolute;top:-7px;left:var(--e-3);background:var(--surface);
         padding:0 var(--e-2);font-size:var(--t-micro);letter-spacing:var(--tr-etiqueta);
         text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .q>.et b{color:var(--ink-2)}

  /* medidor: rótulo · valor · trilho · nota */
  .med{display:grid;grid-template-columns:52px 1fr 64px;align-items:center;
       gap:var(--e-2);margin-bottom:var(--e-2)}
  .med .k{font-size:var(--t-mini);color:var(--ink-3);font-weight:700}
  .med .v{font-size:var(--t-mini);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .trilho{height:7px;border-radius:var(--r-full);background:var(--well);
          border:var(--traco) solid var(--line);overflow:hidden}
  .trilho i{display:block;height:100%;background:var(--accent)}
  .trilho i.alerta{background:var(--warn)}
  .trilho i.grave{background:var(--bad)}
  .rodape-q{margin-top:var(--e-2);padding-top:var(--e-2);border-top:var(--traco) dashed var(--line);
            font-size:var(--t-micro);color:var(--ink-3)}

  /* rádio: números grandes, porque é o que se lê de longe */
  .radio{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--e-3)}
  .rad{border:var(--traco) solid var(--line);border-radius:var(--r-sm);
       background:var(--surface-2);padding:var(--e-2) var(--e-3)}
  .rad .k{font-size:var(--t-micro);letter-spacing:var(--tr-etiqueta);text-transform:uppercase;
          color:var(--ink-3);font-weight:700}
  .rad .v{font-size:var(--t-med);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .rad .u{font-size:var(--t-mini);color:var(--ink-3);font-weight:500}
  /* a grade de recursos: a assinatura, literal — PRB ocupados no quadro */
  .prb{display:grid;grid-template-columns:repeat(auto-fill,minmax(7px,1fr));gap:2px;margin-top:6px}
  .prb i{aspect-ratio:1;border-radius:1px;background:var(--well);border:var(--traco) solid var(--line)}
  .prb i.on{background:var(--accent);border-color:var(--accent)}
  .apagado{opacity:.45}

  /* serviços: uma célula por container, o estado no ponto e na palavra */
  .servicos{display:grid;gap:var(--e-3)}
  .conj-t{display:flex;align-items:baseline;gap:var(--e-2);font-size:var(--t-micro);
          letter-spacing:var(--tr-etiqueta);text-transform:uppercase;color:var(--ink-2);
          font-weight:700;margin-bottom:5px}
  .conj-t span{color:var(--ink-3);font-weight:500;letter-spacing:0;text-transform:none}
  .conj-i{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:var(--e-2)}
  .conj.parado{opacity:.55}
  .srv{display:flex;align-items:center;gap:var(--e-2);border:var(--traco) solid var(--line);
       border-radius:var(--r-sm);background:var(--surface-2);padding:6px 9px;font-size:var(--t-mini)}
  .srv .nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srv .uso{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:var(--t-micro)}

  /* testes: a faixa de execuções + a lista */
  .faixa{display:flex;gap:3px;margin-bottom:var(--e-3);flex-wrap:wrap}
  .faixa i{width:13px;height:22px;border-radius:2px;border:var(--traco) solid var(--line);
           background:var(--n-4);cursor:help}
  .faixa i.ok{background:var(--good);border-color:var(--good)}
  .faixa i.erro{background:var(--bad);border-color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:var(--t-mini)}
  th{text-align:left;font-size:var(--t-micro);letter-spacing:var(--tr-etiqueta);text-transform:uppercase;
     color:var(--ink-3);font-weight:700;padding:5px 7px;border-bottom:var(--traco) solid var(--line-strong)}
  td{padding:6px 7px;border-bottom:var(--traco) solid var(--line);color:var(--ink-2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  th.quando,td.quando{width:1%;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-3)}
  tr:last-child td{border-bottom:none}

  /* leitura: o que os dados dizem e o que fazer */
  .leitura{display:grid;gap:var(--e-2)}
  .item{display:grid;grid-template-columns:auto 1fr;gap:var(--e-3);align-items:start;
        border:var(--traco) solid var(--line);border-left:3px solid var(--line-strong);
        border-radius:var(--r-sm);background:var(--surface-2);padding:var(--e-3)}
  .item[data-n="bom"]{border-left-color:var(--good)}
  .item[data-n="atencao"]{border-left-color:var(--warn)}
  .item[data-n="falha"]{border-left-color:var(--bad)}
  .item .g{font-size:var(--t-base);line-height:1}
  .item h4{margin:0 0 3px;font-size:var(--t-corpo);font-weight:700}
  .item p{margin:0;font-size:var(--t-mini);color:var(--ink-2);line-height:1.55;
          font-family:var(--fonte-texto)}
  .item p b{color:var(--ink)}
  .item .faz{display:block;margin-top:5px;color:var(--accent-text);font-weight:600}
  .vazio{color:var(--ink-3);font-size:var(--t-mini);padding:var(--e-2) 0}
</style>
</head>
<body>

<div class="topo">
  <a class="voltar" href="/">← Painel</a>
  <span class="sep">·</span>
  <span class="marca">Core5G<b>_ARM64</b> — <span data-i18n="an.titulo">Análise</span></span>
  <span class="estado">
    <span class="estado-ponto" id="pt-lab" data-estado="ocioso"></span>
    <span id="rot-lab">…</span>   <!-- texto vem do ciclo; sem data-i18n, senão o apply() o sobrescreve -->
  </span>
  <span class="relogio" id="relogio">—</span>
  <div id="lang-menu"></div>
  <button class="btn" id="tema" title="Alternar tema">◐</button>
</div>

<div class="grade">
  <div class="q">
    <span class="et"><span data-i18n="an.servidor">Servidor</span> · <b id="cpu-modelo">—</b></span>
    <div id="host"></div>
  </div>

  <div class="q" id="q-radio">
    <span class="et"><span data-i18n="an.radio">Rádio</span> · <b>gNB OAI (E2)</b></span>
    <div class="radio" id="radio"></div>
    <div class="rodape-q" id="radio-nota">—</div>
  </div>

  <div class="q larga">
    <span class="et"><span data-i18n="an.servicos">Serviços</span> · <b id="srv-resumo">—</b></span>
    <div class="servicos" id="servicos"></div>
  </div>

  <div class="q larga">
    <span class="et"><span data-i18n="an.testes">Testes</span> · <b id="teste-resumo">—</b></span>
    <div class="faixa" id="faixa"></div>
    <div id="testes"></div>
  </div>

  <div class="q larga">
    <span class="et" data-i18n="an.leitura">Leitura e sugestões</span>
    <div class="leitura" id="leitura"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
// A tela é redesenhada a cada ciclo, então o texto dinâmico pede tradução na
// hora — `data-i18n` só resolve o que já está no HTML.
// `I18N` é declarado com `const` no topo do i18n.js, e const global NÃO vira
// propriedade de window: testar `window.I18N` dava sempre undefined, e a tela
// mostrava as chaves cruas ("an.no_ar") em vez do texto.
const temI18n = typeof I18N !== 'undefined';
const T = (k, p) => (temI18n ? I18N.t(k, p) : k);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const num = (v, d = 1) => (v == null || isNaN(v) ? '—' : Number(v).toFixed(d).replace('.', ','));

$('#tema').addEventListener('click', () => {
  const atual = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = atual;
  try { localStorage.setItem('c5g-theme', atual); } catch (e) {}
});

async function pega(url) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

// ---- SERVIDOR ------------------------------------------------------------
// Barra + valor + o limiar em que aquele número deixa de ser detalhe. O swap é
// o único cujo primeiro byte já é aviso: quando o box começa a paginar, o SSH
// cai antes de a memória acabar.
function medidor(k, valor, pct, nota, nivel) {
  const cls = nivel === 'grave' ? ' grave' : nivel === 'alerta' ? ' alerta' : '';
  return `<div class="med"><span class="k">${k}</span>
    <span class="trilho"><i class="${cls.trim()}" style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>
    <span class="v">${valor}</span></div>` + (nota ? `<div class="rodape-q">${nota}</div>` : '');
}

function pintaHost(t) {
  const h = (t && t.host) || {};
  $('#cpu-modelo').textContent = h.cpu_model ? `${h.cpu_count} vCPU · ${h.cpu_model}` : '—';
  const swapPct = h.swap_total_mb ? (100 * h.swap_used_mb / h.swap_total_mb) : 0;
  const cargaPct = h.cpu_count ? (100 * h.load1 / h.cpu_count) : 0;
  $('#host').innerHTML =
      medidor('CPU', num(h.cpu_pct) + '%', h.cpu_pct || 0, '', h.cpu_pct > 90 ? 'grave' : h.cpu_pct > 70 ? 'alerta' : '')
    + medidor('RAM', num(h.mem_pct) + '%', h.mem_pct || 0, '', h.mem_pct > 90 ? 'grave' : h.mem_pct > 75 ? 'alerta' : '')
    + medidor('SWAP', (h.swap_used_mb || 0) + ' MB', swapPct, '', h.swap_used_mb > 0 ? 'grave' : '')
    + medidor('DISCO', num(h.disk_pct) + '%', h.disk_pct || 0, '', h.disk_pct > 90 ? 'grave' : h.disk_pct > 80 ? 'alerta' : '')
    + medidor('CARGA', num(h.load1, 2), cargaPct, '', cargaPct > 100 ? 'grave' : cargaPct > 75 ? 'alerta' : '')
    + `<div class="rodape-q">${T('an.host_rodape', { usada: h.mem_used_mb || 0, total: h.mem_total_mb || 0,
         du: num(h.disk_used_gb), dt: num(h.disk_total_gb), n: h.cpu_count || '—' })}</div>`;
}

// ---- RÁDIO ---------------------------------------------------------------
// Os limiares vêm do deck da aula 04. O RFSIM é canal ideal: por isso BLER 0 e
// MCS no teto NÃO são elogio à rede, são o simulador dizendo que não há nada
// atrapalhando. Quem lê a tela precisa saber disso.
const RADIO = [
  { k: 'SNR', u: 'dB', get: (g) => g.snr, d: 1, nota: 'acima de 20 dB é canal bom' },
  { k: 'MCS', u: '', get: (g) => g.mcs, d: 0, nota: '28 é o teto da tabela' },
  { k: 'BLER', u: '%', get: (g) => g.bler, d: 1, nota: 'canal ideal não erra bloco' },
];

function pintaRadio(g) {
  const q = $('#q-radio');
  if (!g || !g.up) {
    q.classList.add('apagado');
    $('#radio').innerHTML = `<div class="vazio">${T('an.sem_radio')}</div>`;
    $('#radio-nota').textContent = T('an.sem_radio_faz');
    return;
  }
  const velho = g.age != null && g.age > 10;
  q.classList.toggle('apagado', velho);
  const cel = (n, tot) => Array.from({ length: Math.min(tot || 0, 120) },
    (_, i) => `<i class="${i < (n || 0) ? 'on' : ''}"></i>`).join('');
  $('#radio').innerHTML = RADIO.map((m) => `
      <div class="rad"><div class="k">${m.k}</div>
        <div class="v">${num(m.get(g), m.d)} <span class="u">${m.u}</span></div></div>`).join('')
    + `<div class="rad"><div class="k">${T('an.prb')}</div>
        <div class="v">${g.prb ?? '—'} <span class="u">${T('an.de')} ${g.nrb ?? '—'}</span></div>
        <div class="prb">${cel(g.prb, g.nrb)}</div></div>`;
  $('#radio-nota').innerHTML = velho
    ? T('an.radio_velho', { s: num(g.age, 0) })
    : T('an.radio_notas', { s: num(g.age, 1) });
}

// ---- SERVIÇOS ------------------------------------------------------------
// O contrato de /api/telemetry é de TRÊS estados, não dos nomes do docker:
// container_status() em ops.py reduz state+health a up | loading | down.
// (Aqui já esteve escrito 'running'/'exited'/'healthy' — nomes que a API nunca
// devolve —, e a tela mostrava "0 no ar de 11" com 9 containers de pé. Só o
// dado real pegou: o simulador local inventava a resposta e concordava com o
// erro. Mapa fechado, e o que não estiver nele é ruído, não um estado novo.)
const ESTADO = { up: 'bom', loading: 'atencao', down: 'falha' };
function classe(status) {
  return ESTADO[String(status || '').toLowerCase()] || 'ocioso';
}

// Um conjunto INTEIRO parado não é incidente: é um laboratório que não foi
// levantado. Incidente é o container caído com os irmãos de pé. A tela mostra
// os dois, mas não confunde um com o outro — e a leitura só acusa o segundo.
const CHAVE_CONJUNTO = { 'p1': 'an.conj_p1', 'p2-core': 'an.conj_p2core',
  'p2-nonrt': 'an.conj_nonrt', 'p2-oransc': 'an.conj_oransc', 'outro': 'an.conj_outro' };
const conjNome = (c) => (CHAVE_CONJUNTO[c] ? T(CHAVE_CONJUNTO[c]) : c);

function porConjunto(cs) {
  const g = {};
  cs.forEach((c) => { (g[c.grupo || 'outro'] ||= []).push(c); });
  return Object.entries(g).map(([chave, itens]) => ({
    chave, itens,
    noAr: itens.filter((c) => classe(c.status) === 'bom').length,
    ligado: itens.some((c) => classe(c.status) === 'bom'),
  })).sort((a, b) => (b.ligado - a.ligado) || a.chave.localeCompare(b.chave));
}

function pintaServicos(t) {
  const cs = (t && t.containers) || [];
  if (!cs.length) {
    $('#servicos').innerHTML = `<div class="vazio">${T('an.sem_containers')}</div>`;
    $('#srv-resumo').textContent = T('an.nada_no_ar');
    return;
  }
  const gs = porConjunto(cs);
  const ligados = gs.filter((g) => g.ligado);
  const parados = gs.filter((g) => !g.ligado);
  $('#srv-resumo').textContent = ligados.map((g) => `${conjNome(g.chave)}: ${g.noAr}/${g.itens.length}`).join(' · ')
    + (parados.length ? ` · ${T(parados.length === 1 ? 'an.conj_parado' : 'an.conj_parados', { n: parados.length })}` : '');
  $('#servicos').innerHTML = gs.map((g) => `
    <div class="conj${g.ligado ? '' : ' parado'}">
      <div class="conj-t">${esc(conjNome(g.chave))}
        <span>${g.ligado ? T('an.no_ar_de', { n: g.noAr, total: g.itens.length }) : T('an.nao_levantado')}</span></div>
      <div class="conj-i">${g.itens.map((c) => `
        <div class="srv" title="${esc(c.name)} — ${esc(c.status)}">
          <span class="estado-ponto" data-estado="${classe(c.status)}"></span>
          <span class="nome">${esc(c.name)}</span>
          <span class="uso">${esc(c.cpu_pct || '')}</span>
        </div>`).join('')}</div>
    </div>`).join('');
}

// ---- TESTES --------------------------------------------------------------
// `started` vem do servidor como timestamp Unix em SEGUNDOS (1787881015.819).
// new Date() interpreta número como MILISSEGUNDOS: passar direto rendia
// 21/01/1970 em toda linha da tabela. Aceita também ISO, se um dia mudar.
function quando(t) {
  if (t == null || t === '') return '—';
  const d = typeof t === 'number' ? new Date(t * 1000) : new Date(t);
  return isNaN(d) ? String(t).slice(0, 16)
    : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function pintaTestes(rs) {
  const lista = (rs && rs.results) || [];
  if (!lista.length) {
    $('#teste-resumo').textContent = T('an.sem_exec');
    $('#faixa').innerHTML = '';
    $('#testes').innerHTML = `<div class="vazio">${T('an.sem_exec_txt')}</div>`;
    return;
  }
  const ult = lista.slice(0, 24);
  const falhas = ult.filter((r) => r.status !== 'ok').length;
  $('#teste-resumo').textContent = T('an.exec_resumo', { n: ult.length, ok: ult.length - falhas, f: falhas });
  $('#faixa').innerHTML = ult.slice().reverse().map((r) =>
    `<i class="${r.status === 'ok' ? 'ok' : 'erro'}" title="${esc(r.label || r.cmd)} — ${esc(r.status)} — ${quando(r.started)}"></i>`).join('');
  // "por" só vira coluna quando há mais de uma pessoa rodando; com uma só,
  // repetir o mesmo nome dez vezes é ruído — ele sobe para a etiqueta.
  const gente = [...new Set(ult.map((r) => r.by).filter(Boolean))];
  $('#testes').innerHTML = `<table>
    <tr><th class="quando">${T('an.col_quando')}</th><th>${T('an.col_teste')}</th>${gente.length > 1 ? `<th>${T('an.col_por')}</th>` : ''}
        <th>${T('an.col_resultado')}</th><th style="text-align:right">${T('an.col_duracao')}</th></tr>
    ${ult.slice(0, 10).map((r) => `<tr>
      <td class="quando">${quando(r.started)}</td>
      <td><a href="/?resultado=${encodeURIComponent(r.id)}">${esc(r.label || r.cmd)}</a></td>
      ${gente.length > 1 ? `<td>${esc(r.by || '—')}</td>` : ''}
      <td><span class="estado-ponto" data-estado="${r.status === 'ok' ? 'bom' : 'falha'}"></span>
          ${r.status === 'ok' ? 'ok' : esc(r.status || 'falha')}</td>
      <td class="num">${r.duration != null ? num(r.duration, 1) + ' s' : '—'}</td></tr>`).join('')}
  </table>`;
  if (gente.length === 1) $('#teste-resumo').textContent += ` · ${T('an.exec_por', { quem: gente[0] })}`;
}

// ---- LEITURA -------------------------------------------------------------
// Cada regra diz TRÊS coisas: o que eu vi, por que importa, o que fazer. Uma
// tela de análise que só mostra número obriga quem lê a saber o limiar de cor.
function leitura(t, g, rs) {
  const h = (t && t.host) || {};
  const cs = (t && t.containers) || [];
  const lista = (rs && rs.results) || [];
  const itens = [];
  const add = (n, glifo, titulo, texto, faz) => itens.push({ n, glifo, titulo, texto, faz });

  if (h.swap_used_mb > 0) {
    add('falha', '⚠', T('an.r_swap_t', { mb: h.swap_used_mb }), T('an.r_swap_d'), T('an.r_swap_f'));
  }
  // Carga alta COM o rádio no ar é o normal deste laboratório, não incidente:
  // o gNB e o UE do RFSIM fazem processamento de sinal e consomem ~280% de CPU
  // sozinhos. Dizer "espere a carga baixar" ali seria um alarme que nunca
  // apaga — e ensinaria a coisa errada. O sinal que importa é o swap.
  if (h.cpu_count && h.load1 > h.cpu_count) {
    const radioNoAr = g && g.up;
    add(radioNoAr ? 'bom' : 'atencao', radioNoAr ? '·' : '▲',
      T('an.r_carga_t', { c: num(h.load1, 2), n: h.cpu_count }),
      T(radioNoAr ? 'an.r_carga_ok' : 'an.r_carga_ruim'),
      T(radioNoAr ? 'an.r_carga_ok_f' : 'an.r_carga_ruim_f'));
  }
  if (h.disk_pct > 85) {
    add('atencao', '▲', T('an.r_disco_t', { p: num(h.disk_pct) }), T('an.r_disco_d'), T('an.r_disco_f'));
  }
  // só é incidente quem caiu COM OS IRMÃOS DE PÉ. Conjunto inteiro parado é
  // laboratório não levantado, e dizer "serviço fora" ali é alarme falso — foi
  // o que aconteceu com o ric_dbaas e o ric_a1mediator, parados havia duas
  // semanas e acusados como se fossem falha do momento.
  const conjuntos = porConjunto(cs);
  const caidos = conjuntos.filter((x) => x.ligado)
    .flatMap((x) => x.itens.filter((c) => classe(c.status) === 'falha'));
  if (caidos.length) {
    add('falha', '✕', T(caidos.length === 1 ? 'an.r_caiu_t' : 'an.r_caiu_t2', { n: caidos.length }),
      T('an.r_caiu_d', { q: caidos.map((c) => esc(c.name)).join(', ') }), T('an.r_caiu_f'));
  }
  const desligados = conjuntos.filter((x) => !x.ligado);
  if (desligados.length) {
    add('bom', '·', T(desligados.length === 1 ? 'an.r_desl_t' : 'an.r_desl_t2', { n: desligados.length }),
      T('an.r_desl_d', { q: desligados.map((x) => esc(conjNome(x.chave))).join(', ') }), T('an.r_desl_f'));
  }
  if (g && g.up && g.age != null && g.age > 10) {
    add('atencao', '▲', T('an.r_velho_t', { s: num(g.age, 0) }), T('an.r_velho_d'), T('an.r_velho_f'));
  }
  const radioFresco = g && g.up && (g.age == null || g.age <= 10);
  if (radioFresco && g.snr != null && g.snr < 20) {
    add('atencao', '▲', T('an.r_snr_t', { v: num(g.snr) }), T('an.r_snr_d'), T('an.r_snr_f'));
  }
  if (radioFresco && g.bler != null && g.bler > 0) {
    add('atencao', '▲', T('an.r_bler_t', { v: num(g.bler) }), T('an.r_bler_d'), T('an.r_bler_f'));
  }
  if (radioFresco && g.nrb && g.prb != null && (100 * g.prb / g.nrb) > 80) {
    add('atencao', '▲', T('an.r_prb_t', { p: num(100 * g.prb / g.nrb) }), T('an.r_prb_d'), T('an.r_prb_f'));
  }
  if (lista.length) {
    const ult = lista.slice(0, 8);
    const falhos = ult.filter((r) => r.status !== 'ok');
    if (falhos.length >= 2) {
      const porCmd = {};
      falhos.forEach((r) => { porCmd[r.cmd] = (porCmd[r.cmd] || 0) + 1; });
      const pior = Object.entries(porCmd).sort((a, b) => b[1] - a[1])[0];
      const repete = pior[1] >= 2;
      add('falha', '✕', T('an.r_falhas_t', { n: falhos.length, tot: ult.length }),
        repete ? T('an.r_falhas_rep', { cmd: esc(pior[0]), n: pior[1] })
               : T('an.r_falhas_esp', { n: Object.keys(porCmd).length }),
        T(repete ? 'an.r_falhas_rep_f' : 'an.r_falhas_esp_f'));
    } else if (!falhos.length) {
      add('bom', '✓', T('an.r_limpo_t', { n: ult.length }), T('an.r_limpo_d'), T('an.r_limpo_f'));
    }
  } else {
    add('bom', '·', T('an.r_nada_t'), T('an.r_nada_d'), T('an.r_nada_f'));
  }
  if (!itens.length) {
    add('bom', '✓', T('an.r_ok_t'), T('an.r_ok_d'), T('an.r_ok_f'));
  }

  $('#leitura').innerHTML = itens.map((i) => `
    <div class="item" data-n="${i.n}">
      <span class="g">${i.glifo}</span>
      <div><h4>${i.titulo}</h4><p>${i.texto}<span class="faz">→ ${i.faz}</span></p></div>
    </div>`).join('');
}

// ---- ciclo ---------------------------------------------------------------
async function ciclo() {
  const [t, g, rs] = await Promise.all([
    pega('/api/telemetry'), pega('/api/topology/gnb-stats'), pega('/api/results'),
  ]);
  pintaHost(t); pintaRadio(g); pintaServicos(t); pintaTestes(rs); leitura(t, g, rs);
  const noAr = g && g.up;
  $('#pt-lab').dataset.estado = noAr ? 'bom' : 'ocioso';
  $('#relogio').textContent = new Date().toLocaleTimeString();
  if (temI18n) {
    I18N.apply();                       // rótulos estáticos
    document.title = I18N.t('an.titulo') + ' · Core5G_ARM64';
    $('#rot-lab').textContent = T(noAr ? 'an.no_ar' : 'an.parado');   // depois do apply
  }
}
ciclo();
setInterval(ciclo, 4000);
</script>
