<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core5G_ARM64 — Topologia Open RAN</title>
<script>document.documentElement.dataset.theme = localStorage.getItem("c5g-theme") || "dark";</script>
<style>
  :root {
    --bg:#16181d; --panel:#1e2128; --border:#2c3038; --text:#e6e6e6;
    --muted:#8a8f98; --accent:#e8590c; --green:#2f9e44; --yellow:#f59f00;
    --red:#e03131; --info:#4dabf7;
    --c-external:#4dabf7; --c-admin:#b197fc; --c-ran:#2f9e44; --c-core:#e8590c;
    --c-core-cp:#1c7ed6; --c-core-up:#e8590c; --c-nonrt:#f59f00; --c-oransc:#f06595;
    --btn-bg:#21242b; --btn-hover:#262a32; --grid-dot:#23262e;
    --planned:#3a3f48; --plan-fg:#5a606b;
    --overlay:rgba(0,0,0,.72); --panel-glass:rgba(24,26,31,.82);
    --ok-bg:#163a1f; --ok-fg:#69db7c; --err-bg:#3a1616; --err-fg:#ff8787;
    --info-bg:#16263a; --info-fg:#74c0fc;
    --packet:#ffd43b; --label-bg:#21242b;
    --band-fill:.07; --band-stroke:.45;
  }
  :root[data-theme="light"] {
    --bg:#eef0f4; --panel:#ffffff; --border:#d5dae1; --text:#1c2129;
    --muted:#5d6570; --accent:#d9500a; --green:#2b8a3e; --yellow:#e67700;
    --red:#c92a2a; --info:#1971c2;
    --c-external:#1971c2; --c-admin:#7048e8; --c-ran:#2b8a3e; --c-core:#d9500a;
    --c-core-cp:#1971c2; --c-core-up:#d9500a; --c-nonrt:#e67700; --c-oransc:#d6336c;
    --btn-bg:#eef0f3; --btn-hover:#dfe3e9; --grid-dot:#d9dde3;
    --planned:#b9c0ca; --plan-fg:#98a0ab;
    --overlay:rgba(23,27,34,.45); --panel-glass:rgba(255,255,255,.92);
    --ok-bg:#d7f0de; --ok-fg:#217a37; --err-bg:#fbe1e1; --err-fg:#c22929;
    --info-bg:#dcecfb; --info-fg:#1971c2;
    --packet:#d9480f; --label-bg:#ffffff;
    --band-fill:.13; --band-stroke:.6;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  /* qualidade base: foco visível no teclado + respeito a reduced-motion */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ---- Identidade: barra superior + botões mono ---- */
  header { padding:11px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; flex-shrink:0; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.01em; }
  header h1 b { color:var(--accent); font-weight:600; }
  .btn { display:inline-flex; align-items:center; gap:7px; background:var(--btn-bg); color:var(--text);
         border:1px solid var(--border); border-radius:7px; padding:6px 12px; font-size:12.5px;
         cursor:pointer; text-decoration:none; transition:border-color .15s, background .15s; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); background:var(--btn-hover); }
  .btn svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .modes { display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .modes button { background:var(--btn-bg); color:var(--muted); border:none; border-right:1px solid var(--border);
                  padding:6px 13px; font-size:12.5px; cursor:pointer; transition:.15s; }
  .modes button:last-child { border-right:none; }
  .modes button:hover { color:var(--text); background:var(--btn-hover); }
  .modes button.active { background:var(--accent); color:#fff; }
  .spacer { margin-left:auto; }
  /* seletor de idioma (#lang-menu) estilizado por static/i18n.js (ensureLangCSS) */

  /* ---- Palco ---- */
  #stage { flex:1; position:relative; overflow:hidden;
           background:radial-gradient(circle at 1px 1px,var(--grid-dot) 1px,transparent 0); background-size:26px 26px; }
  svg#diagram { width:100%; height:100%; cursor:grab; }
  svg#diagram.grabbing { cursor:grabbing; }
  .zoom-ctrl { position:absolute; bottom:14px; right:14px; display:flex; gap:6px; }
  .zoom-ctrl button { width:32px; height:32px; background:var(--panel); border:1px solid var(--border);
                      color:var(--text); border-radius:6px; cursor:pointer; font-size:16px; }
  .zoom-ctrl button:hover { border-color:var(--accent); }
  .mode-hint { position:absolute; top:12px; left:14px; font-size:12px; color:var(--muted);
               background:var(--panel-glass); padding:7px 13px; border-radius:7px; border:1px solid var(--border); max-width:440px; }

  /* ---- Cards (nós) ---- */
  .node { cursor:pointer; }
  .node .card { rx:9; stroke-width:1.5; fill:var(--panel); }
  .node .title { font-size:12.5px; font-weight:600; fill:var(--text); }
  .node .role  { font-size:12px; font-weight:600; }
  .node .tech  { font-size:9.5px; fill:var(--muted); font-family:"SF Mono",Menlo,Consolas,monospace; }
  .node.planned .card { fill:var(--btn-bg); stroke:var(--planned) !important; stroke-dasharray:5 4; }
  .node.planned .title { fill:var(--plan-fg); } .node.planned .role { fill:var(--plan-fg) !important; }
  .node .dot { r:4; }

  /* bandas de plano (CUPS): retângulo de fundo por camada com band:true no JSON */
  .band { pointer-events:none; fill-opacity:var(--band-fill); stroke-opacity:var(--band-stroke); }
  .jnum { font-size:11px; font-weight:800; fill:#1c2129; }
  .band-label { font-size:11px; font-weight:700; letter-spacing:.09em; opacity:.9; }

  .link { stroke-width:1.6; fill:none; }
  .link.dashed { stroke-dasharray:6 5; }
  .link.planned { stroke:var(--planned); stroke-dasharray:4 5; }
  .link.warn { stroke:var(--red); stroke-width:2.2; }
  .link.flow { stroke-width:3; stroke-dasharray:9 7; animation:flowmove .55s linear infinite; }
  .link.flow.planned { stroke-width:2.4; }
  @keyframes flowmove { from { stroke-dashoffset:0; } to { stroke-dashoffset:-16; } }
  .link-label { font-size:10px; fill:var(--text); font-family:"SF Mono",Menlo,Consolas,monospace; }
  .link-label-bg { fill:var(--label-bg); stroke:var(--border); stroke-width:1; }

  /* ---- Legenda: badge minimalista no canto inferior esquerdo ---- */
  #legend { position:absolute; bottom:14px; left:14px; z-index:40; max-width:300px;
            background:var(--panel-glass); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
            border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.35);
            font-size:11.5px; overflow:hidden; transition:max-width .2s; }
  #legend .lg-head { display:flex; align-items:center; gap:7px; padding:8px 11px; cursor:pointer; user-select:none; color:var(--muted); }
  #legend .lg-head svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8; flex-shrink:0; }
  #legend .lg-head .lg-t { font-weight:600; color:var(--text); }
  #legend .lg-head .chev { margin-left:auto; transition:transform .2s; }
  #legend.collapsed .lg-head .chev { transform:rotate(-90deg); }
  #legend.collapsed .lg-body { display:none; }
  #legend .lg-body { padding:2px 11px 11px; max-height:46vh; overflow-y:auto; }
  #legend .lg-sec { font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:8px 0 5px; }
  #legend .lg-sec:first-child { margin-top:2px; }
  .lyk { display:flex; align-items:center; gap:7px; white-space:nowrap; color:var(--text); margin:3px 0; }
  .lyk .sw { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .ifk { display:flex; gap:8px; align-items:baseline; margin:3px 0; }
  .ifk .k { font-family:"SF Mono",Menlo,Consolas,monospace; color:var(--info); flex-shrink:0; min-width:54px; }
  .ifk .v { color:var(--muted); line-height:1.35; }

  /* ---- Modal (clique no nó) ---- */
  .overlay { display:none; position:fixed; inset:0; background:var(--overlay); z-index:200; align-items:center; justify-content:center; }
  .overlay.open { display:flex; }
  #node-modal { background:var(--panel); border:1px solid var(--border); border-radius:12px; width:92vw; max-width:560px; max-height:84vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--border); }
  .modal-head h3 { font-size:15px; margin:0; }
  .modal-head .role-badge { font-size:12px; font-weight:600; margin-top:3px; }
  .modal-head .x { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
  .modal-body { padding:16px 18px; overflow-y:auto; }
  .badge { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:600; margin-bottom:12px; }
  .b-run{background:var(--ok-bg);color:var(--ok-fg)} .b-stop{background:var(--err-bg);color:var(--err-fg)}
  .b-plan{background:var(--btn-bg);color:var(--plan-fg)} .b-ext{background:var(--info-bg);color:var(--info-fg)}
  .flow3 { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .flow3 .row { display:flex; gap:10px; align-items:flex-start; }
  .flow3 .ic { font-size:14px; flex-shrink:0; width:18px; text-align:center; }
  .flow3 .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .flow3 .val { font-size:13px; line-height:1.45; }
  #node-modal dl { margin:0; border-top:1px solid var(--border); padding-top:10px; }
  #node-modal dt { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-top:9px; }
  #node-modal dd { margin:2px 0 0; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; word-break:break-word; }

  /* ---- Overlay de Logs ---- */
  #logs-modal { background:var(--panel); border:1px solid var(--border); border-radius:12px; width:92vw; max-width:860px; height:82vh; display:flex; flex-direction:column; overflow:hidden; }
  #logs-head { display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--border); }
  #logs-head h3 { font-size:14px; margin:0; }
  #logs-head .x { margin-left:auto; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
  /* corpo de logs = terminal: escuro nos DOIS temas, paleta ISO fixa
     (mesma regra dos consoles do painel — nunca variáveis de tema aqui) */
  #logs-body { flex:1; overflow-y:auto; padding:8px 0; background:#0d0e11; }
  .logsec { border-bottom:1px solid #2c3038; }
  .logsec h4 { margin:0; padding:9px 18px 6px; font-size:12px; color:#e8590c; display:flex; align-items:center; gap:8px; }
  .logsec h4 .dot { width:7px; height:7px; border-radius:50%; background:#2f9e44; }
  .logsec pre { margin:0; padding:0 18px 10px; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:11px; line-height:1.5; color:#9aa4b2; white-space:pre-wrap; word-break:break-word; }
  #logs-empty { color:#8a8f98; padding:24px; text-align:center; }
  #logs-ts { font-size:11px; color:var(--muted); }
  .logsec pre .err { color:#ff8787; } .logsec pre .warn { color:#ffd43b; }

  /* #3 — badge de RAN ao vivo no card do gNB */
  .gnb-live { font-size:10px; font-family:"SF Mono",Menlo,Consolas,monospace; fill:var(--green); }

  /* #1 — pacote viajante (modo Fluxo): amarelo no escuro, laranja queimado no claro */
  .packet { fill:var(--packet); stroke:var(--bg); stroke-width:1; }

  /* #2 — tour guiado */
  #tour-box { display:none; position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
              width:min(560px,90%); background:var(--panel); border:1px solid var(--accent); border-radius:10px;
              padding:13px 16px; box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:50; }
  #tour-box.open { display:block; }
  #tour-box .t { font-size:13px; font-weight:600; margin-bottom:4px; }
  #tour-box .t .chip { font-size:10px; font-weight:600; padding:2px 8px; border-radius:9px; margin-right:8px; color:#fff; }
  #tour-box .c { font-size:12.5px; color:var(--muted); line-height:1.45; }
  #tour-box .nav { display:flex; gap:8px; margin-top:11px; align-items:center; }
  #tour-box .nav .step { font-size:11px; color:var(--muted); margin-right:auto; }
  #tour-box .nav button { background:var(--btn-bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 13px; font-size:12px; cursor:pointer; }
  #tour-box .nav button:hover { border-color:var(--accent); }
  #tour-box .nav button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .node.tour-dim, .link.tour-dim, .link-label.tour-dim, .link-label-bg.tour-dim { opacity:.12 !important; }
</style>
</head>
<body class="mode-tecnico">
<header>
  <h1>Core5G<b>_ARM64</b> · <span data-i18n="topo.title">Topologia</span> <span id="topo-proj" style="color:var(--muted);font-weight:400;font-size:14px"></span></h1>
  <a class="btn" href="/" data-i18n-title="topo.back_title" title="Voltar ao painel">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> <span data-i18n="topo.panel_btn">Painel</span>
  </a>
  <button class="btn" id="logs-btn" data-i18n-title="topo.logs_btn_title" title="Logs ao vivo dos componentes">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> <span data-i18n="topo.logs_btn">Logs</span>
  </button>
  <button class="btn" id="tour-btn" data-i18n-title="topo.tour_btn_title" title="Tour guiado pelas camadas">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.5 6.5L21 9l-5 4 1.5 7L12 16l-5.5 4L8 13 3 9l6.5-.5z"/></svg> <span data-i18n="topo.tour_btn">Tour</span>
  </button>
  <button class="btn" id="journey-btn" data-i18n-title="topo.journey.btn_title" title="Jornada do UE">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg> <span data-i18n="topo.journey.btn">Jornada do UE</span>
  </button>
  <div id="lang-menu" title="Idioma"></div>
  <button class="btn en-btn" id="energy-btn" title="Eficiência ARM × x86 (tabela com fontes)">⚡ N1×x86</button>
  <button class="btn" id="theme-btn" title="Alternar tema claro/escuro">◐</button>
  <div class="modes spacer">
    <button data-mode="simplificado" data-i18n="topo.mode_simple">Simplificado</button>
    <button data-mode="tecnico" class="active" data-i18n="topo.mode_tech">Técnico</button>
    <button data-mode="fluxo" data-i18n="topo.mode_flow">Fluxo de dados</button>
    <button data-mode="troubleshooting" data-i18n="topo.mode_ts">Troubleshooting</button>
  </div>
</header>

<div id="stage">
  <div class="mode-hint" id="mode-hint"></div>
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="zoom-ctrl">
    <button id="zin">+</button><button id="zout">−</button><button id="zfit">⤢</button>
  </div>
  <div id="tour-box">
    <div class="t" id="tour-title"></div>
    <div class="c" id="tour-caption"></div>
    <div class="nav">
      <span class="step" id="tour-step"></span>
      <button id="tour-prev" data-i18n="topo.tour_prev">← Anterior</button>
      <button id="tour-next" class="primary" data-i18n="topo.tour_next">Próximo →</button>
      <button id="tour-exit" data-i18n="topo.tour_exit">Sair</button>
    </div>
  </div>
  <!-- Legenda minimalista, ancorada no canto inferior esquerdo (não ocupa linha) -->
  <div id="legend"></div>
</div>

<!-- Modal de detalhe do nó -->
<div class="overlay" id="node-overlay">
  <div id="node-modal">
    <div class="modal-head">
      <div>
        <h3 id="nm-title">—</h3>
        <div class="role-badge" id="nm-role"></div>
      </div>
      <button class="x" id="nm-close">×</button>
    </div>
    <div class="modal-body">
      <span class="badge" id="nm-status"></span>
      <div class="flow3">
        <div class="row"><div class="ic" style="color:var(--info)">↘</div><div><div class="lab" data-i18n="topo.nm_from">De onde vem a informação</div><div class="val" id="nm-from"></div></div></div>
        <div class="row"><div class="ic" style="color:var(--accent)">⚙</div><div><div class="lab" data-i18n="topo.nm_does">O que faz</div><div class="val" id="nm-does"></div></div></div>
        <div class="row"><div class="ic" style="color:var(--green)">↗</div><div><div class="lab" data-i18n="topo.nm_to">Para onde vai</div><div class="val" id="nm-to"></div></div></div>
      </div>
      <dl id="nm-tech"></dl>
    </div>
  </div>
</div>

<!-- Overlay de logs -->
<div class="overlay" id="logs-overlay">
  <div id="logs-modal">
    <div id="logs-head">
      <h3 data-i18n="topo.logs_title">Logs ao vivo — o que está acontecendo</h3>
      <span id="logs-ts"></span>
      <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="logs-auto" checked style="vertical-align:middle"> <span data-i18n="topo.logs_auto">auto (5s)</span></label>
      <button class="btn" id="logs-refresh"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg> <span data-i18n="topo.refresh">Atualizar</span></button>
      <button class="x" id="logs-close">×</button>
    </div>
    <div id="logs-body"></div>
  </div>
</div>

<script src="../i18n.js"></script>
<script>
// ============================================================================
// Topologia Open RAN — lê /api/topology (inventário real + status vivo).
// Edite static/openran-topology.json para alterar o desenho (ver _como_atualizar).
// ============================================================================
const NODE_W = 184, NODE_H = 66, SVGNS = "http://www.w3.org/2000/svg";
let TOPO = null, currentMode = "tecnico", logsTimer = null, gnbStats = null, tourLayer = null, journeyStep = null;
// Projeto selecionado via ?proj=p1|p2 (padrão p2).
const PROJ = (new URLSearchParams(location.search).get("proj") === "p1") ? "p1" : "p2";
function setProjTitle() { document.getElementById("topo-proj").textContent = I18N.t(PROJ === "p1" ? "topo.p1_title" : "topo.p2_title"); }
setProjTitle();
const svg = document.getElementById("diagram");
// i18n: tradução com fallback no texto pt do JSON (pt = canônico; nós nunca usam o dict em pt)
const trf = (k, fb) => { if (I18N.lang === "pt") return fb; const v = I18N.t(k); return v === k ? fb : v; };
const sanit = x => x.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
const FLOW_IFACES = new Set(["RF","N1","N2","N11/Nsmf","E2","E42","N3","N4","N6","A1","SDL"]);
const SECONDARY = new Set(["SBI","Nausf","Nudm","Nudr","SQL","Telemetria"]); // N11/Nsmf fica visível: didático (sessão PDU)
const MODE_HINT_KEYS = { simplificado: "topo.hint_simple", tecnico: "topo.hint_tech", fluxo: "topo.hint_flow", troubleshooting: "topo.hint_ts" };

function el(t,a,p){ const n=document.createElementNS(SVGNS,t); for(const k in a)n.setAttribute(k,a[k]); if(p)p.appendChild(n); return n; }
function nodeById(id){ return TOPO.nodes.find(n=>n.id===id); }
function center(n){ return {x:n.x+NODE_W/2, y:n.y+NODE_H/2}; }
function layerColor(n){ return getComputedStyle(document.documentElement).getPropertyValue("--c-"+n.layer).trim(); }
function statusOf(n){ if(n.kind==="external")return "external"; if(n.planned)return "planned"; return (TOPO.live_status&&TOPO.live_status[n.id])||"stopped"; }
const STATUS_BADGE={running:["b-run","topo.st_running"],stopped:["b-stop","topo.st_stopped"],planned:["b-plan","topo.st_planned"],external:["b-ext","topo.st_external"]};
function borderColor(n){ const s=statusOf(n); if(s==="planned")return "#3a3f48";
  if(currentMode==="troubleshooting"){ if(s==="running")return "var(--green)"; if(s==="stopped")return "var(--red)"; return "#3a3f48"; }
  return layerColor(n); }

function render(){
  svg.innerHTML="";
  const defs=el("defs",{},svg);
  [["arrow","var(--muted)"],["arrow-warn","var(--red)"],["arrow-plan","var(--planned)"]].forEach(([id,col])=>{
    const m=el("marker",{id,markerWidth:9,markerHeight:9,refX:7,refY:3,orient:"auto",markerUnits:"strokeWidth"},defs);
    el("path",{d:"M0,0 L7,3 L0,6 Z",fill:col},m);
  });
  // 4 camadas em ordem de z: bandas (fundo) → links → nós → rótulos de interface (topo).
  // Os rótulos no topo garantem que nenhum card "engole" o badge da interface.
  const gB=el("g",{},svg), gL=el("g",{},svg), gN=el("g",{},svg), gT=el("g",{},svg);

  // bandas de plano (CUPS): retângulo suave englobando os nós das camadas com band:true
  for(const k in TOPO.layers){
    const ly=TOPO.layers[k]; if(!ly.band) continue;
    const ns=TOPO.nodes.filter(n=>n.layer===k); if(!ns.length) continue;
    const x0=Math.min(...ns.map(n=>n.x))-24, y0=Math.min(...ns.map(n=>n.y))-30;
    const x1=Math.max(...ns.map(n=>n.x+NODE_W))+24, y1=Math.max(...ns.map(n=>n.y+NODE_H))+14;
    const bandCol=`var(--c-${k})`;
    el("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:14,class:"band",fill:bandCol,
               stroke:bandCol,"stroke-dasharray":"3 7"},gB);
    const bl=el("text",{x:x0+14,y:y0+18,class:"band-label",fill:bandCol},gB);
    bl.textContent=trf(`topo.${PROJ}.layer.${k}`, ly.label).toUpperCase();
  }

  // links paralelos (mesmo par de nós, ex.: N1 e N2) recebem offset perpendicular
  const pairTotal={}, pairSeen={};
  TOPO.links.forEach(lk=>{ const k=[lk.from,lk.to].sort().join("|"); pairTotal[k]=(pairTotal[k]||0)+1; });

  TOPO.links.forEach(lk=>{
    const a=nodeById(lk.from), b=nodeById(lk.to); if(!a||!b)return;
    // modo simplificado: esconde links secundários (SBI mesh, SQL, telemetria)
    if(currentMode==="simplificado" && !journeyStep && (SECONDARY.has(lk.iface) || lk.secondary)) return;
    const ca={...center(a)}, cb={...center(b)};
    const pk=[lk.from,lk.to].sort().join("|"); const pi=(pairSeen[pk]=(pairSeen[pk]||0)+1)-1;
    if(pairTotal[pk]>1){
      const dx=cb.x-ca.x, dy=cb.y-ca.y, L=Math.hypot(dx,dy)||1;
      const off=(pi-(pairTotal[pk]-1)/2)*22;
      ca.x+=-dy/L*off; ca.y+=dx/L*off; cb.x+=-dy/L*off; cb.y+=dx/L*off;
    }
    const cls=["link"]; let marker="arrow";
    if(lk.warn){cls.push("warn");marker="arrow-warn";}
    else if(lk.planned){cls.push("planned");marker="arrow-plan";}
    else if(lk.dashed)cls.push("dashed");
    const pairK=[lk.from,lk.to].sort().join("|");
    let jDir=null;
    if(journeyStep && !journeyStep.full){
      const m=journeyStep.links.find(e=>e.k===pairK && (!e.iface || e.iface===lk.iface));
      if(m) jDir=m.dir;   // etapa que fixa a interface (ex.: N2 vs N1 no mesmo par) só acende a certa
    }
    const jAct=!!jDir;
    const isFlow = ((currentMode==="fluxo" && FLOW_IFACES.has(lk.iface)) || jAct) && !lk.planned;
    if(isFlow) cls.push("flow");
    // tour: esmaece o que não toca a camada · jornada: esmaece o que não está na etapa
    const tourDim = (tourLayer && a.layer!==tourLayer && b.layer!==tourLayer) || (journeyStep && !journeyStep.full && !jAct);
    if(tourDim) cls.push("tour-dim");
    const stroke=lk.warn?"var(--red)":lk.planned?"#3a3f48":layerColor(b);
    el("path",{d:`M${ca.x},${ca.y} L${cb.x},${cb.y}`,class:cls.join(" "),stroke,"marker-end":`url(#${marker})`},gL);
    // #1 pacote viajante: ponto animado percorrendo o link no modo Fluxo
    if(isFlow && !lk.planned){
      let fa=ca, fb=cb;
      if(jDir && jDir[0]===lk.to){ fa=cb; fb=ca; }   // pacote no sentido da etapa (ida/volta)
      const dot=el("circle",{r:3.5,class:"packet"},gL);
      const dur=(Math.hypot(fb.x-fa.x,fb.y-fa.y)/260+0.5).toFixed(2)+"s";
      el("animate",{attributeName:"cx",from:fa.x,to:fb.x,dur,repeatCount:"indefinite"},dot);
      el("animate",{attributeName:"cy",from:fa.y,to:fb.y,dur,repeatCount:"indefinite"},dot);
    }
    // rótulo SEMPRE visível — desenhado na camada de topo (gT), nunca atrás de um card
    const mx=(ca.x+cb.x)/2, my=(ca.y+cb.y)/2, tw=lk.iface.length*6.6+14;
    el("rect",{x:mx-tw/2,y:my-9,width:tw,height:18,rx:9,class:"link-label-bg"+(tourDim?" tour-dim":"")},gT);
    const t=el("text",{x:mx,y:my+3.5,"text-anchor":"middle",class:"link-label"+(tourDim?" tour-dim":"")},gT); t.textContent=lk.iface;
  });

  // Jornada: badge numerado (1, 2, 2.1…) da etapa ativa — no meio do 1º link,
  // ou no canto do nó quando a etapa não tem fluxo (ex.: "recebe IP").
  if(journeyStep && !journeyStep.full && journeyStep.num){
    let bx, by;
    if(journeyStep.links.length){
      const L=journeyStep.links[0], a=nodeById(L.dir[0]), b=nodeById(L.dir[1]);
      if(a&&b){ const ca=center(a), cb=center(b); bx=(ca.x+cb.x)/2; by=(ca.y+cb.y)/2-26; }
    } else if(journeyStep.nodes.length){
      const n=nodeById(journeyStep.nodes[0]); if(n){ bx=n.x+NODE_W-4; by=n.y-4; }
    }
    if(bx!==undefined){
      el("circle",{cx:bx,cy:by,r:13,fill:"#f59f00",stroke:"var(--bg)","stroke-width":2.5},gT);
      const bt=el("text",{x:bx,y:by+4,"text-anchor":"middle",class:"jnum"},gT);
      bt.textContent=journeyStep.num;
    }
  }

  TOPO.nodes.forEach(n=>{
    const tourDim = (tourLayer && n.layer!==tourLayer) || (journeyStep && !journeyStep.full && !journeyStep.nodes.includes(n.id));
    const g=el("g",{class:"node"+(n.planned?" planned":"")+(tourDim?" tour-dim":"")},gN); g.dataset.id=n.id;
    el("rect",{x:n.x,y:n.y,width:NODE_W,height:NODE_H,rx:9,class:"card",stroke:borderColor(n)},g);
    el("rect",{x:n.x,y:n.y,width:4,height:NODE_H,rx:2,fill:layerColor(n),opacity:n.planned?.4:1},g);
    const tt=el("text",{x:n.x+14,y:n.y+20,class:"title"},g); tt.textContent=trf(`topo.${PROJ}.${n.id}.label`, n.label);
    // PALAVRA-FUNÇÃO em destaque (o que o componente faz, em 1 palavra)
    const rl=el("text",{x:n.x+14,y:n.y+37,class:"role",fill:n.planned?"#5a606b":layerColor(n)},g); rl.textContent=trf(`topo.${PROJ}.${n.id}.role`, n.role||"");
    // #3 — métrica de RAN ao vivo no card do gNB (SNR/MCS/PRB do log real)
    if(n.id==="gnb" && gnbStats && gnbStats.up && gnbStats.snr!==undefined){
      const parts=[`SNR ${gnbStats.snr}dB`];
      if(gnbStats.mcs!==undefined)parts.push(`MCS ${gnbStats.mcs}`);
      if(gnbStats.prb!==undefined)parts.push(`${gnbStats.prb} PRB`);
      el("text",{x:n.x+14,y:n.y+54,class:"gnb-live"},g).textContent="● "+parts.join(" · ");
    } else if(currentMode!=="simplificado"){
      const tech=el("text",{x:n.x+14,y:n.y+53,class:"tech"},g);
      const bits=[]; if(n.ip&&n.ip!=="—")bits.push(n.ip); if(n.ports&&n.ports!=="—")bits.push(n.ports.split(/[·,]/)[0].trim());
      tech.textContent=bits.join(" · ").slice(0,32);
    }
    const s=statusOf(n);
    if(s!=="external"){ const col=s==="running"?"var(--green)":s==="stopped"?"var(--red)":"#5a606b";
      el("circle",{cx:n.x+NODE_W-12,cy:n.y+12,class:"dot",fill:col},g); }
    g.addEventListener("click",()=>openNode(n.id));
  });
  document.getElementById("mode-hint").textContent=I18N.t(MODE_HINT_KEYS[currentMode]);
}

// ---- modal do nó (de onde vem / o que faz / pra onde vai) ----
function openNode(id){

  const roleEl=document.getElementById("nm-role"); roleEl.textContent=trf(`topo.${PROJ}.${n.id}.role`, n.role||""); roleEl.style.color=layerColor(n);
  const [bc,btKey]=STATUS_BADGE[statusOf(n)];
  const stEl=document.getElementById("nm-status"); stEl.className="badge "+bc; stEl.textContent=I18N.t(btKey);
  document.getElementById("nm-from").textContent=trf(`topo.${PROJ}.${n.id}.from`, n.from||"—");
  document.getElementById("nm-does").textContent=trf(`topo.${PROJ}.${n.id}.does`, n.does||n.fn||"—");
  document.getElementById("nm-to").textContent=trf(`topo.${PROJ}.${n.id}.to`, n.to||"—");
  const tech=document.getElementById("nm-tech");
  const kind=I18N.t({container:"topo.kind_container",native:"topo.kind_native",systemd:"topo.kind_systemd",external:"topo.kind_external"}[n.kind])||n.kind;
  let h=`<dt>${I18N.t("topo.nm_type")}</dt><dd>${kind}</dd>`;
  if(n.image)h+=`<dt>${I18N.t("topo.nm_image")}</dt><dd>${n.image}</dd>`;
  if(n.ip&&n.ip!=="—")h+=`<dt>IP</dt><dd>${n.ip}</dd>`;
  if(n.ports&&n.ports!=="—")h+=`<dt>${I18N.t("topo.nm_ports")}</dt><dd>${n.ports}</dd>`;
  if(n.network)h+=`<dt>${I18N.t("topo.nm_net")}</dt><dd>${n.network}</dd>`;
  const conns=TOPO.links.filter(l=>l.from===n.id||l.to===n.id)
    .map(l=>`${l.iface}: ${l.from===n.id?"→ "+nodeById(l.to).label:"← "+nodeById(l.from).label}`);
  if(conns.length)h+=`<dt>${I18N.t("topo.nm_conns")}</dt><dd style="font-family:inherit">${conns.join("<br>")}</dd>`;
  tech.innerHTML=h;
  document.getElementById("node-overlay").classList.add("open");
}

// ---- legenda: badge minimalista no canto inferior esquerdo (recolhível) ----
function renderLegend(){

  for(const k in TOPO.layers) body+=`<div class="lyk"><span class="sw" style="background:var(--c-${k})"></span>${trf(`topo.${PROJ}.layer.${k}`, TOPO.layers[k].label)}</div>`;

// ---- logs ao vivo ----
function colorLog(l){
  const e=escapeHtml(l);
  const cls=/error|fail|reject|refused|cannot|killed|exit code [1-9]|❌|✕/i.test(l) ? "err"
           : /warn|retry|timeout|starting|obsolete/i.test(l) ? "warn" : "";
  return cls ? `<span class="${cls}">${e}</span>` : e;
}
async function loadLogs(){
  const body=document.getElementById("logs-body");
  try{
    const res=await fetch("/api/topology/logs?proj="+PROJ,{cache:"no-store"});
    if(res.status===401){ window.location.href="/login"; return; }
    const d=await res.json();
    document.getElementById("logs-ts").textContent=I18N.t("topo.logs_updated")+" "+new Date().toLocaleTimeString(document.documentElement.lang||"pt-BR");
    if(!d.sections.length){ body.innerHTML='<div id="logs-empty">'+I18N.t('topo.logs_empty')+'</div>'; return; }
    body.innerHTML=d.sections.map(s=>`<div class="logsec"><h4><span class="dot"></span>${s.title}</h4><pre>${s.lines.map(colorLog).join("\n")}</pre></div>`).join("");
  }catch(e){ body.innerHTML='<div id="logs-empty">'+I18N.t('topo.logs_fail')+'</div>'; }
}
function escapeHtml(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function openLogs(){ document.getElementById("logs-overlay").classList.add("open"); loadLogs();
  if(document.getElementById("logs-auto").checked) logsTimer=setInterval(loadLogs,5000); }
function closeLogs(){ document.getElementById("logs-overlay").classList.remove("open"); clearInterval(logsTimer); logsTimer=null; }
document.getElementById("logs-btn").onclick=openLogs;
document.getElementById("logs-close").onclick=closeLogs;
document.getElementById("logs-refresh").onclick=loadLogs;
document.getElementById("logs-overlay").addEventListener("click",e=>{ if(e.target.id==="logs-overlay")closeLogs(); });
document.getElementById("logs-auto").onchange=e=>{ clearInterval(logsTimer); logsTimer=null; if(e.target.checked)logsTimer=setInterval(loadLogs,5000); };

// ---- pan / zoom ----
let vb={x:0,y:0,w:1300,h:900};
function applyVB(){ svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function fit(){ vb={x:-20,y:-20,w:TOPO.canvas.w+40,h:TOPO.canvas.h+40}; applyVB(); }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const s=e.deltaY>0?1.1:0.9; const r=svg.getBoundingClientRect();
  const mx=vb.x+(e.clientX-r.left)/r.width*vb.w, my=vb.y+(e.clientY-r.top)/r.height*vb.h;
  vb.x=mx-(mx-vb.x)*s; vb.y=my-(my-vb.y)*s; vb.w*=s; vb.h*=s; applyVB(); },{passive:false});
let drag=null;
svg.addEventListener("mousedown",e=>{ drag={x:e.clientX,y:e.clientY}; svg.classList.add("grabbing"); });
window.addEventListener("mouseup",()=>{ drag=null; svg.classList.remove("grabbing"); });
window.addEventListener("mousemove",e=>{ if(!drag)return; const r=svg.getBoundingClientRect();
  vb.x-=(e.clientX-drag.x)/r.width*vb.w; vb.y-=(e.clientY-drag.y)/r.height*vb.h; drag={x:e.clientX,y:e.clientY}; applyVB(); });
document.getElementById("zin").onclick=()=>{ vb.w*=.85; vb.h*=.85; applyVB(); };
document.getElementById("zout").onclick=()=>{ vb.w/=.85; vb.h/=.85; applyVB(); };
document.getElementById("zfit").onclick=fit;

  : ["external","admin","ran","nonrt","oransc","core-cp","core-up"];
const TOUR = TOUR_LAYERS.map(layer => ({ layer }));
let tourIdx=0;
function showTour(i){
  tourIdx=(i+TOUR.length)%TOUR.length;
  const s=TOUR[tourIdx]; tourLayer=s.layer;

const JOURNEY = PROJ==="p1" ? JOURNEY_P1 : JOURNEY_P2;
let journeyIdx=0;
const BADGE_COL={req:"#2f9e44",opt:"#1c7ed6"};
function buildJStep(s){
  const nodes=new Set(s.nodes); (s.flow||[]).forEach(([a,b])=>{nodes.add(a);nodes.add(b);});
  return { nodes:[...nodes], full:!!s.full, num:s.num||null,
    links:(s.flow||[]).map(([a,b,iface])=>({k:[a,b].sort().join("|"), iface:iface||null, dir:[a,b]})) };
}
function showJourney(i){
  journeyIdx=(i+JOURNEY.length)%JOURNEY.length;
  const s=JOURNEY[journeyIdx]; tourLayer=null; journeyStep=buildJStep(s);
  const ttl=I18N.t(`topo.journey.${PROJ}.${s.id}.title`), cap=I18N.t(`topo.journey.${PROJ}.${s.id}.caption`);
  const badge=s.badge?`<span class="chip" style="background:${BADGE_COL[s.badge]}">${I18N.t("topo.journey.badge_"+s.badge)}</span>`:"";
  const numChip=s.num?`<span class="chip" style="background:#f59f00;color:#1c2129">${s.num}</span>`:"";
  document.getElementById("tour-title").innerHTML=numChip+badge+ttl;
  document.getElementById("tour-caption").textContent=cap;
  document.getElementById("tour-step").textContent=`${journeyIdx+1} / ${JOURNEY.length}`;
  render();
}
function startJourney(){ if(tourLayer) endTour(); document.getElementById("tour-box").classList.add("open"); showJourney(0); }
function endJourney(){ journeyStep=null; document.getElementById("tour-box").classList.remove("open"); render(); }
document.getElementById("journey-btn").onclick=()=>{ journeyStep?endJourney():startJourney(); };

async function load(){
  const res=await fetch("/api/topology?proj="+PROJ,{cache:"no-store"});
  if(res.status===401){ window.location.href="/login"; return; }
  TOPO=await res.json(); await loadGnbStats(); fit(); render(); renderLegend();
}
load();
